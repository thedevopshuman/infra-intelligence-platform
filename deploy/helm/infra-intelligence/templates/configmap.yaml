apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "infra-intelligence.fullname" . }}
  labels:
    {{- include "infra-intelligence.labels" . | nindent 4 }}
data:
  IIP_DEPLOYMENT_HELM_CHART_VERSION: {{ .Chart.Version | quote }}
  IIP_DEPLOYMENT_IMAGE_DIGEST: {{ .Values.image.digest | quote }}
  IIP_HTTP_HOST: {{ .Values.config.httpHost | quote }}
  IIP_HTTP_PORT: {{ .Values.config.httpPort | quote }}
  IIP_AUTH_MODE: {{ .Values.auth.mode | quote }}
  IIP_AUTH_OIDC_CONFIG_JSON: {{ .Values.auth.oidc.configJson | quote }}
  IIP_POLICY_MODE: {{ .Values.policy.mode | quote }}
  IIP_POLICY_CONFIG_JSON: {{ .Values.policy.externalHttp.configJson | quote }}
  IIP_CREDENTIAL_BROKER_MODE: {{ .Values.credentialBroker.mode | quote }}
  IIP_CREDENTIAL_BROKER_CONFIG_JSON: {{ .Values.credentialBroker.externalHttp.configJson | quote }}
  IIP_DATABASE_AUTO_MIGRATE: "false"
  IIP_EVENT_DELIVERY_SLO_WINDOW_SECONDS: {{ .Values.eventDeliverySlo.windowSeconds | quote }}
  IIP_EVENT_DELIVERY_SLO_MAXIMUM_LATENCY_SECONDS: {{ .Values.eventDeliverySlo.maximumDeliveryLatencySeconds | quote }}
  IIP_EVENT_DELIVERY_SLO_MINIMUM_ATTAINMENT_BASIS_POINTS: {{ .Values.eventDeliverySlo.minimumAttainmentBasisPoints | quote }}
  IIP_EVENT_DELIVERY_SLO_MINIMUM_ELIGIBLE_EVENTS: {{ .Values.eventDeliverySlo.minimumEligibleEvents | quote }}
  IIP_INVESTIGATION_COMPLETION_SLO_WINDOW_SECONDS: {{ .Values.investigationCompletionSlo.windowSeconds | quote }}
  IIP_INVESTIGATION_COMPLETION_SLO_MAXIMUM_SECONDS: {{ .Values.investigationCompletionSlo.maximumCompletionSeconds | quote }}
  IIP_INVESTIGATION_COMPLETION_SLO_MINIMUM_ATTAINMENT_BASIS_POINTS: {{ .Values.investigationCompletionSlo.minimumAttainmentBasisPoints | quote }}
  IIP_INVESTIGATION_COMPLETION_SLO_MINIMUM_ELIGIBLE_JOBS: {{ .Values.investigationCompletionSlo.minimumEligibleJobs | quote }}
  IIP_INVESTIGATION_MAX_OUTSTANDING_JOBS_PER_TENANT: {{ .Values.investigationQueue.maxOutstandingJobsPerTenant | quote }}
  IIP_EVIDENCE_RETENTION_ENABLED: {{ .Values.evidenceRetention.enabled | quote }}
  IIP_EVIDENCE_RETENTION_INTERVAL_SECONDS: {{ .Values.evidenceRetention.intervalSeconds | int64 | quote }}
  IIP_EVIDENCE_RETENTION_EPHEMERAL_SECONDS: {{ .Values.evidenceRetention.ephemeralSeconds | int64 | quote }}
  IIP_EVIDENCE_RETENTION_STANDARD_SECONDS: {{ .Values.evidenceRetention.standardSeconds | int64 | quote }}
  IIP_EVIDENCE_RETENTION_EXTENDED_SECONDS: {{ .Values.evidenceRetention.extendedSeconds | int64 | quote }}
  IIP_EVIDENCE_RETENTION_BATCH_SIZE: {{ .Values.evidenceRetention.batchSize | int64 | quote }}
  IIP_QUERY_AVAILABILITY_SLO_WINDOW_SECONDS: {{ .Values.queryAvailabilitySlo.windowSeconds | quote }}
  IIP_QUERY_AVAILABILITY_SLO_MINIMUM_BASIS_POINTS: {{ .Values.queryAvailabilitySlo.minimumAvailabilityBasisPoints | quote }}
  IIP_QUERY_AVAILABILITY_SLO_MINIMUM_ELIGIBLE_REQUESTS: {{ .Values.queryAvailabilitySlo.minimumEligibleRequests | quote }}
  IIP_READINESS_DATABASE_TIMEOUT_SECONDS: {{ .Values.probes.readiness.databaseTimeoutSeconds | quote }}
  IIP_OTEL_METRICS_ENABLED: {{ .Values.telemetry.metricsEnabled | quote }}
  IIP_OTEL_TRACES_ENABLED: {{ .Values.telemetry.tracesEnabled | quote }}
  IIP_OTLP_RECEIVER_MODE: "disabled"
  IIP_OTEL_INGESTION_ATTRIBUTE_MODE: {{ .Values.telemetry.attributeMode | quote }}
  IIP_OTEL_INVESTIGATION_ATTRIBUTE_MODE: {{ .Values.telemetry.investigationAttributeMode | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.telemetry.otlpEndpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.telemetry.protocol | quote }}
  OTEL_METRIC_EXPORT_INTERVAL: {{ .Values.telemetry.exportIntervalMillis | quote }}
  OTEL_METRIC_EXPORT_TIMEOUT: {{ .Values.telemetry.exportTimeoutMillis | quote }}
  OTEL_BSP_SCHEDULE_DELAY: {{ .Values.telemetry.traceScheduleDelayMillis | quote }}
  OTEL_BSP_EXPORT_TIMEOUT: {{ .Values.telemetry.traceExportTimeoutMillis | quote }}
  OTEL_BSP_MAX_QUEUE_SIZE: {{ .Values.telemetry.traceMaxQueueSize | quote }}
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: {{ .Values.telemetry.traceMaxExportBatchSize | quote }}
  IIP_TELEMETRY_HEALTH_INTERVAL_SECONDS: {{ .Values.telemetry.healthReportIntervalSeconds | quote }}
  IIP_TELEMETRY_HEALTH_STALE_AFTER_SECONDS: {{ .Values.telemetry.healthStaleAfterSeconds | quote }}
  IIP_TELEMETRY_HEALTH_RETENTION_SECONDS: {{ .Values.telemetry.healthRetentionSeconds | quote }}
  IIP_TELEMETRY_EXPORT_SLO_WINDOW_SECONDS: {{ .Values.telemetry.exportSloWindowSeconds | quote }}
  IIP_TELEMETRY_EXPORT_SLO_MINIMUM_ATTAINMENT_BASIS_POINTS: {{ .Values.telemetry.exportSloMinimumAttainmentBasisPoints | quote }}
  IIP_TELEMETRY_EXPORT_SLO_MINIMUM_ELIGIBLE_ATTEMPTS: {{ .Values.telemetry.exportSloMinimumEligibleAttempts | quote }}
  IIP_TELEMETRY_EXPORT_SLO_RETENTION_SECONDS: {{ .Values.telemetry.exportSloRetentionSeconds | quote }}
  IIP_TELEMETRY_EXPORT_BURN_RATE_SHORT_WINDOW_SECONDS: {{ .Values.telemetry.exportBurnRateShortWindowSeconds | quote }}
  IIP_TELEMETRY_EXPORT_BURN_RATE_LONG_WINDOW_SECONDS: {{ .Values.telemetry.exportBurnRateLongWindowSeconds | quote }}
  IIP_TELEMETRY_EXPORT_BURN_RATE_MINIMUM_ATTAINMENT_BASIS_POINTS: {{ .Values.telemetry.exportBurnRateMinimumAttainmentBasisPoints | quote }}
  IIP_TELEMETRY_EXPORT_BURN_RATE_MINIMUM_ELIGIBLE_ATTEMPTS: {{ .Values.telemetry.exportBurnRateMinimumEligibleAttempts | quote }}
  IIP_TELEMETRY_EXPORT_BURN_RATE_CRITICAL_HUNDREDTHS: {{ .Values.telemetry.exportBurnRateCriticalHundredths | quote }}
  IIP_COLLECTOR_QUEUE_LOSS_BINDING_JSON: {{ .Values.collectorQueueLoss.bindingJson | quote }}
  IIP_COLLECTOR_QUEUE_LOSS_WINDOW_SECONDS: {{ .Values.collectorQueueLoss.windowSeconds | quote }}
  IIP_COLLECTOR_QUEUE_LOSS_MAX_LOSS_BASIS_POINTS: {{ .Values.collectorQueueLoss.maxLossBasisPoints | quote }}
  IIP_COLLECTOR_QUEUE_LOSS_MAX_QUEUE_UTILIZATION_BASIS_POINTS: {{ .Values.collectorQueueLoss.maxQueueUtilizationBasisPoints | quote }}
  IIP_COLLECTOR_QUEUE_LOSS_MINIMUM_ELIGIBLE_ATTEMPTS: {{ .Values.collectorQueueLoss.minimumEligibleAttempts | quote }}
  OTEL_SERVICE_NAME: {{ .Values.telemetry.serviceName | quote }}
  IIP_TELEMETRY_METRICS_BACKEND: {{ .Values.telemetryEvidence.backend | quote }}
  IIP_TELEMETRY_LOGS_BACKEND: {{ .Values.logEvidence.backend | quote }}
  IIP_PROMETHEUS_INTEGRATIONS_JSON: {{ .Values.telemetryEvidence.prometheus.integrationsJson | quote }}
  IIP_LOKI_INTEGRATIONS_JSON: {{ .Values.logEvidence.loki.integrationsJson | quote }}
  IIP_OPENSEARCH_INTEGRATIONS_JSON: {{ .Values.logEvidence.opensearch.integrationsJson | quote }}
  IIP_KUBERNETES_EVENTS_BACKEND: {{ .Values.kubernetesEventEvidence.backend | quote }}
  IIP_KUBERNETES_EVENTS_INTEGRATIONS_JSON: {{ .Values.kubernetesEventEvidence.integrationsJson | quote }}
  IIP_KUBERNETES_ACTION_EXECUTOR: {{ .Values.kubernetesActions.executor | quote }}
  IIP_KUBERNETES_ACTIONS_INTEGRATIONS_JSON: {{ .Values.kubernetesActions.integrationsJson | quote }}
  IIP_CONTEXT_BACKEND: {{ .Values.contextEvidence.backend | quote }}
