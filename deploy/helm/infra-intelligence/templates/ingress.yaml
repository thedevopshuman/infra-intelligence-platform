{{- if .Values.ingress.enabled }}
{{- $ingressAnnotations := deepCopy .Values.ingress.annotations }}
{{- $_ := set $ingressAnnotations .Values.ingress.tlsRedirectAnnotation .Values.ingress.tlsRedirectValue }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "infra-intelligence.fullname" . }}
  labels:
    {{- include "infra-intelligence.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $ingressAnnotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.existingSecret | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | quote }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "infra-intelligence.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
