apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-observer
  namespace: iip-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iip-kubernetes-observer-cluster-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: iip-kubernetes-observer-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: iip-kubernetes-observer-cluster-read
subjects:
  - kind: ServiceAccount
    name: kubernetes-observer
    namespace: iip-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iip-kubernetes-observer-read
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iip-kubernetes-observer-read
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iip-kubernetes-observer-read
subjects:
  - kind: ServiceAccount
    name: kubernetes-observer
    namespace: iip-system
