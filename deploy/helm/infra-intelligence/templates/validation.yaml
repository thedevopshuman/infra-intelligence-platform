{{- if and .Values.worker.enabled (ge (int .Values.worker.heartbeatSeconds) (int .Values.worker.leaseSeconds)) }}
{{- fail "worker.heartbeatSeconds must be less than worker.leaseSeconds" }}
{{- end }}
{{- if gt (int .Values.eventPublisher.retryBaseSeconds) (int .Values.eventPublisher.retryMaxSeconds) }}
{{- fail "eventPublisher.retryBaseSeconds must not exceed eventPublisher.retryMaxSeconds" }}
{{- end }}
{{- if ge (int .Values.eventDeliverySlo.maximumDeliveryLatencySeconds) (int .Values.eventDeliverySlo.windowSeconds) }}
{{- fail "eventDeliverySlo.maximumDeliveryLatencySeconds must be less than eventDeliverySlo.windowSeconds" }}
{{- end }}
{{- if ge (int .Values.investigationCompletionSlo.maximumCompletionSeconds) (int .Values.investigationCompletionSlo.windowSeconds) }}
{{- fail "investigationCompletionSlo.maximumCompletionSeconds must be less than investigationCompletionSlo.windowSeconds" }}
{{- end }}
{{- if gt (int .Values.evidenceRetention.ephemeralSeconds) (int .Values.evidenceRetention.standardSeconds) }}
{{- fail "evidenceRetention.ephemeralSeconds must not exceed evidenceRetention.standardSeconds" }}
{{- end }}
{{- if gt (int .Values.evidenceRetention.standardSeconds) (int .Values.evidenceRetention.extendedSeconds) }}
{{- fail "evidenceRetention.standardSeconds must not exceed evidenceRetention.extendedSeconds" }}
{{- end }}
{{- if and .Values.evidenceRetention.enabled (not .Values.worker.enabled) }}
{{- fail "worker.enabled must be true when evidenceRetention.enabled=true" }}
{{- end }}
{{- if gt (int .Values.telemetry.traceMaxExportBatchSize) (int .Values.telemetry.traceMaxQueueSize) }}
{{- fail "telemetry.traceMaxExportBatchSize must not exceed telemetry.traceMaxQueueSize" }}
{{- end }}
{{- if lt (int .Values.telemetry.healthStaleAfterSeconds) (mul (int .Values.telemetry.healthReportIntervalSeconds) 2) }}
{{- fail "telemetry.healthStaleAfterSeconds must be at least twice telemetry.healthReportIntervalSeconds" }}
{{- end }}
{{- if lt (int .Values.telemetry.healthRetentionSeconds) (mul (int .Values.telemetry.healthStaleAfterSeconds) 2) }}
{{- fail "telemetry.healthRetentionSeconds must be at least twice telemetry.healthStaleAfterSeconds" }}
{{- end }}
{{- if lt (int .Values.telemetry.exportSloRetentionSeconds) (int .Values.telemetry.exportSloWindowSeconds) }}
{{- fail "telemetry.exportSloRetentionSeconds must be at least telemetry.exportSloWindowSeconds" }}
{{- end }}
{{- if ge (int .Values.telemetry.exportBurnRateShortWindowSeconds) (int .Values.telemetry.exportBurnRateLongWindowSeconds) }}
{{- fail "telemetry.exportBurnRateShortWindowSeconds must be less than telemetry.exportBurnRateLongWindowSeconds" }}
{{- end }}
{{- if lt (int .Values.telemetry.exportSloRetentionSeconds) (int .Values.telemetry.exportBurnRateLongWindowSeconds) }}
{{- fail "telemetry.exportSloRetentionSeconds must be at least telemetry.exportBurnRateLongWindowSeconds" }}
{{- end }}
{{- if and (or .Values.telemetry.metricsEnabled .Values.telemetry.tracesEnabled) (not .Values.telemetry.otlpEndpoint) }}
{{- fail "telemetry.otlpEndpoint is required when telemetry export is enabled" }}
{{- end }}
{{- if and (or .Values.otlpReceiver.enabled .Values.otlpLogsReceiver.enabled .Values.aiUsageReceiver.enabled) .Values.telemetry.metricsEnabled .Values.networkPolicy.enabled (not .Values.networkPolicy.otlpEgress.enabled) }}
{{- fail "networkPolicy.otlpEgress.enabled is required for OTLP receiver telemetry export" }}
{{- end }}
{{- if eq .Values.auth.mode "local-hashed" }}
{{- if not .Values.auth.existingSecret }}
{{- fail "auth.existingSecret is required in local-hashed mode" }}
{{- end }}
{{- else if eq .Values.auth.oidc.configJson "{}" }}
{{- fail "auth.oidc.configJson must contain a reviewed OIDC configuration in oidc mode" }}
{{- end }}
{{- if and (eq .Values.policy.mode "external-http") (eq .Values.policy.externalHttp.configJson "{}") }}
{{- fail "policy.externalHttp.configJson is required in external-http mode" }}
{{- end }}
{{- if and (eq .Values.credentialBroker.mode "external-http") (eq .Values.credentialBroker.externalHttp.configJson "{}") }}
{{- fail "credentialBroker.externalHttp.configJson is required in external-http mode" }}
{{- end }}
{{- if and .Values.otlpReceiver.enabled (not .Values.otlpReceiver.channelsExistingSecret) }}
{{- fail "otlpReceiver.channelsExistingSecret is required when the metrics receiver is enabled" }}
{{- end }}
{{- if and .Values.otlpLogsReceiver.enabled (not .Values.otlpLogsReceiver.channelsExistingSecret) }}
{{- fail "otlpLogsReceiver.channelsExistingSecret is required when the logs receiver is enabled" }}
{{- end }}
{{- if and .Values.aiUsageReceiver.enabled (not .Values.aiUsageReceiver.channelsExistingSecret) }}
{{- fail "aiUsageReceiver.channelsExistingSecret is required when the AI usage receiver is enabled" }}
{{- end }}
{{- if and (ne .Values.otlpIngest.tls.mode "disabled") (not .Values.otlpIngest.tls.serverExistingSecret) }}
{{- fail "otlpIngest.tls.serverExistingSecret is required when receiver TLS is enabled" }}
{{- end }}
{{- if and (eq .Values.otlpIngest.tls.mode "mutual-spiffe") (not .Values.otlpIngest.tls.clientCaExistingSecret) }}
{{- fail "otlpIngest.tls.clientCaExistingSecret is required in mutual-spiffe mode" }}
{{- end }}
{{- if and (eq .Values.otlpIngest.tls.mode "mutual-spiffe") (not .Values.otlpIngest.tls.identitiesExistingSecret) }}
{{- fail "otlpIngest.tls.identitiesExistingSecret is required in mutual-spiffe mode" }}
{{- end }}
{{- if and (ne .Values.otlpIngest.tls.mode "mutual-spiffe") .Values.otlpIngest.tls.clientCrlExistingSecret }}
{{- fail "otlpIngest.tls.clientCrlExistingSecret is only meaningful in mutual-spiffe mode" }}
{{- end }}
{{- if .Values.backup.enabled }}
{{- if not .Values.database.existingSecret }}
{{- fail "database.existingSecret is required when backup.enabled=true" }}
{{- end }}
{{- if not .Values.backup.destination.existingClaim }}
{{- fail "backup.destination.existingClaim is required when backup.enabled=true" }}
{{- end }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "networkPolicy.enabled must be true when backup is enabled" }}
{{- end }}
{{- if not .Values.networkPolicy.databaseEgress.enabled }}
{{- fail "networkPolicy.databaseEgress.enabled must be true when backup is enabled" }}
{{- end }}
{{- end }}
{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.className }}
{{- fail "ingress.className is required when ingress is enabled" }}
{{- end }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.host is required when ingress is enabled" }}
{{- end }}
{{- if not .Values.ingress.tls.existingSecret }}
{{- fail "ingress.tls.existingSecret is required when ingress is enabled" }}
{{- end }}
{{- if not .Values.ingress.tlsRedirectAnnotation }}
{{- fail "ingress.tlsRedirectAnnotation is required when ingress is enabled" }}
{{- end }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "networkPolicy.enabled must be true when ingress is enabled" }}
{{- end }}
{{- if not .Values.networkPolicy.ingressController.enabled }}
{{- fail "networkPolicy.ingressController.enabled must be true when ingress is enabled" }}
{{- end }}
{{- if or (not .Values.networkPolicy.ingressController.namespaceSelector) (not .Values.networkPolicy.ingressController.podSelector) }}
{{- fail "networkPolicy.ingressController selectors must be explicit when ingress is enabled" }}
{{- end }}
{{- end }}
