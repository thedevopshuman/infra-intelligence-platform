{{- if .Values.kubernetesEventEvidence.credentialsExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "kubernetes-event-credentials" "kind" "Secret" "name" .Values.kubernetesEventEvidence.credentialsExistingSecret "keys" (list .Values.kubernetesEventEvidence.credentialsSecretKey)) -}}
{{- end -}}
{{- if .Values.kubernetesEventEvidence.caBundleExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "kubernetes-event-ca" "kind" "Secret" "name" .Values.kubernetesEventEvidence.caBundleExistingSecret "keys" (list .Values.kubernetesEventEvidence.caBundleSecretKey)) -}}
{{- end -}}
{{- if .Values.kubernetesActions.credentialsExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "kubernetes-action-credentials" "kind" "Secret" "name" .Values.kubernetesActions.credentialsExistingSecret "keys" (list .Values.kubernetesActions.credentialsSecretKey)) -}}
{{- end -}}
{{- if .Values.kubernetesActions.caBundleExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "kubernetes-action-ca" "kind" "Secret" "name" .Values.kubernetesActions.caBundleExistingSecret "keys" (list .Values.kubernetesActions.caBundleSecretKey)) -}}
{{- end -}}
{{- if .Values.contextEvidence.integrationsExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "context-integrations" "kind" "Secret" "name" .Values.contextEvidence.integrationsExistingSecret "keys" (list .Values.contextEvidence.integrationsSecretKey)) -}}
{{- end -}}
{{- if and (eq .Values.contextEvidence.backend "github") .Values.contextEvidence.credentialsExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "github-context-credentials" "kind" "Secret" "name" .Values.contextEvidence.credentialsExistingSecret "keys" (list .Values.contextEvidence.credentialsSecretKey)) -}}
{{- end -}}
{{- if and (eq .Values.contextEvidence.backend "github") .Values.contextEvidence.caBundleExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "github-context-ca" "kind" "Secret" "name" .Values.contextEvidence.caBundleExistingSecret "keys" (list .Values.contextEvidence.caBundleSecretKey)) -}}
{{- end -}}
{{- if .Values.contextEvidence.documentsExistingConfigMap -}}
{{- $dependencies = append $dependencies (dict "purpose" "context-documents" "kind" "ConfigMap" "name" .Values.contextEvidence.documentsExistingConfigMap "keys" (list)) -}}
{{- end -}}
{{- if .Values.investigationSignalCatalog.existingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "investigation-signal-catalog" "kind" "Secret" "name" .Values.investigationSignalCatalog.existingSecret "keys" (list .Values.investigationSignalCatalog.secretKey)) -}}
{{- end -}}
{{- if .Values.evidenceRedaction.policiesExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "evidence-redaction-policies" "kind" "Secret" "name" .Values.evidenceRedaction.policiesExistingSecret "keys" (list .Values.evidenceRedaction.policiesSecretKey)) -}}
{{- end -}}
{{- if .Values.otlpReceiver.channelsExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "metrics-receiver-channels" "kind" "Secret" "name" .Values.otlpReceiver.channelsExistingSecret "keys" (list .Values.otlpReceiver.channelsSecretKey)) -}}
{{- end -}}
{{- if .Values.otlpLogsReceiver.channelsExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "logs-receiver-channels" "kind" "Secret" "name" .Values.otlpLogsReceiver.channelsExistingSecret "keys" (list .Values.otlpLogsReceiver.channelsSecretKey)) -}}
{{- end -}}
{{- if .Values.aiUsageReceiver.channelsExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "ai-usage-receiver-channels" "kind" "Secret" "name" .Values.aiUsageReceiver.channelsExistingSecret "keys" (list .Values.aiUsageReceiver.channelsSecretKey)) -}}
{{- end -}}
{{- if .Values.otlpIngest.tls.serverExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "otlp-server-tls" "kind" "Secret" "name" .Values.otlpIngest.tls.serverExistingSecret "keys" (list .Values.otlpIngest.tls.certificateSecretKey .Values.otlpIngest.tls.privateKeySecretKey)) -}}
{{- end -}}
{{- if .Values.otlpIngest.tls.clientCaExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "otlp-client-ca" "kind" "Secret" "name" .Values.otlpIngest.tls.clientCaExistingSecret "keys" (list .Values.otlpIngest.tls.clientCaSecretKey)) -}}
{{- end -}}
{{- if .Values.otlpIngest.tls.clientCrlExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "otlp-client-crl" "kind" "Secret" "name" .Values.otlpIngest.tls.clientCrlExistingSecret "keys" (list .Values.otlpIngest.tls.clientCrlSecretKey)) -}}
{{- end -}}
{{- if .Values.otlpIngest.tls.identitiesExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "otlp-client-identities" "kind" "Secret" "name" .Values.otlpIngest.tls.identitiesExistingSecret "keys" (list .Values.otlpIngest.tls.identitiesSecretKey)) -}}
{{- end -}}
{{- if .Values.aiAttribution.policiesExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "ai-attribution-policies" "kind" "Secret" "name" .Values.aiAttribution.policiesExistingSecret "keys" (list .Values.aiAttribution.policiesSecretKey)) -}}
{{- end -}}
{{- if .Values.aiCostEngine.catalogsExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "ai-price-catalogs" "kind" "Secret" "name" .Values.aiCostEngine.catalogsExistingSecret "keys" (list .Values.aiCostEngine.catalogsSecretKey)) -}}
{{- end -}}
{{- if .Values.aiCostEngine.qualificationsExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "ai-price-catalog-qualifications" "kind" "Secret" "name" .Values.aiCostEngine.qualificationsExistingSecret "keys" (list .Values.aiCostEngine.qualificationsSecretKey)) -}}
{{- end -}}
{{- if .Values.aiSavingsEngine.profilesExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "ai-savings-profiles" "kind" "Secret" "name" .Values.aiSavingsEngine.profilesExistingSecret "keys" (list .Values.aiSavingsEngine.profilesSecretKey)) -}}
{{- end -}}
{{- if .Values.eventPublisher.httpsWebhook.tokenExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "event-publisher-token" "kind" "Secret" "name" .Values.eventPublisher.httpsWebhook.tokenExistingSecret "keys" (list .Values.eventPublisher.httpsWebhook.tokenSecretKey)) -}}
{{- end -}}
{{- if .Values.eventPublisher.httpsWebhook.caBundleExistingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "event-publisher-ca" "kind" "Secret" "name" .Values.eventPublisher.httpsWebhook.caBundleExistingSecret "keys" (list .Values.eventPublisher.httpsWebhook.caBundleSecretKey)) -}}
{{- end -}}
{{- if .Values.backup.destination.existingClaim -}}
{{- $dependencies = append $dependencies (dict "purpose" "backup-destination" "kind" "PersistentVolumeClaim" "name" .Values.backup.destination.existingClaim "keys" (list)) -}}
{{- end -}}
{{- $profile := dict
  "schemaVersion" "1"
  "chart" (dict "name" .Chart.Name "version" .Chart.Version "applicationVersion" .Chart.AppVersion)
  "image" (dict "repository" .Values.image.repository "digest" .Values.image.digest)
  "api" (dict "replicaCount" .Values.replicaCount)
  "worker" (dict "enabled" .Values.worker.enabled "replicaCount" .Values.worker.replicaCount "tenantCount" (len .Values.worker.tenants))
  "database" (dict "existingSecretConfigured" (not (empty .Values.database.existingSecret)) "migrationsEnabled" .Values.database.migrations.enabled)
  "authentication" (dict "mode" .Values.auth.mode "oidcConfigurationReviewed" (ne .Values.auth.oidc.configJson "{}"))
  "policy" (dict "mode" .Values.policy.mode "configurationReviewed" (ne .Values.policy.externalHttp.configJson "{}"))
  "credentialBroker" (dict "mode" .Values.credentialBroker.mode "configurationReviewed" (ne .Values.credentialBroker.externalHttp.configJson "{}"))
  "ingress" (dict "enabled" .Values.ingress.enabled "classConfigured" (not (empty .Values.ingress.className)) "hostConfigured" (not (empty .Values.ingress.host)) "tlsConfigured" (not (empty .Values.ingress.tls.existingSecret)) "redirectConfigured" (not (empty .Values.ingress.tlsRedirectAnnotation)))
  "backup" (dict "enabled" .Values.backup.enabled "destinationConfigured" (not (empty .Values.backup.destination.existingClaim)))
  "evidenceRetention" (dict "enabled" .Values.evidenceRetention.enabled)
  "evidenceRedaction" (dict "customPoliciesConfigured" (not (empty .Values.evidenceRedaction.policiesExistingSecret)))
  "evidenceBackends" (dict "metrics" .Values.telemetryEvidence.backend "logs" .Values.logEvidence.backend "kubernetesEvents" .Values.kubernetesEventEvidence.backend "context" .Values.contextEvidence.backend)
  "telemetry" (dict "metricsEnabled" .Values.telemetry.metricsEnabled "tracesEnabled" .Values.telemetry.tracesEnabled "endpointConfigured" (not (empty .Values.telemetry.otlpEndpoint)) "collectorQueueLossConfigured" (not (empty .Values.collectorQueueLoss.bindingJson)))
  "operationalAlerts" (dict "enabled" .Values.operationalAlerts.enabled "apiVersion" .Values.operationalAlerts.apiVersion "metricNameProfile" .Values.operationalAlerts.metricNameProfile "namespace" (default .Release.Namespace .Values.operationalAlerts.namespace) "selectorLabelCount" (len .Values.operationalAlerts.labels))
  "networkPolicy" (dict "enabled" .Values.networkPolicy.enabled "ingressController" .Values.networkPolicy.ingressController.enabled "databaseEgress" .Values.networkPolicy.databaseEgress.enabled "otlpEgress" .Values.networkPolicy.otlpEgress.enabled "prometheusEgress" .Values.networkPolicy.prometheusEgress.enabled "lokiEgress" .Values.networkPolicy.lokiEgress.enabled "opensearchEgress" .Values.networkPolicy.opensearchEgress.enabled "contextEgress" .Values.networkPolicy.contextEgress.enabled "kubernetesApiEgress" .Values.networkPolicy.kubernetesApiEgress.enabled "oidcEgress" .Values.networkPolicy.oidcEgress.enabled "policyEgress" .Values.networkPolicy.policyEgress.enabled "credentialBrokerEgress" .Values.networkPolicy.credentialBrokerEgress.enabled "otlpReceiverIngress" .Values.networkPolicy.otlpReceiverIngress.enabled)
  "podDisruptionBudget" (dict
    "api" (dict "enabled" .Values.podDisruptionBudget.enabled "minAvailable" .Values.podDisruptionBudget.minAvailable)
    "worker" (dict "enabled" .Values.worker.podDisruptionBudget.enabled "minAvailable" .Values.worker.podDisruptionBudget.minAvailable)
    "receiver" (dict "enabled" .Values.otlpIngest.podDisruptionBudget.enabled "minAvailable" .Values.otlpIngest.podDisruptionBudget.minAvailable))
  "topologySpread" (dict "enabled" .Values.availability.topologySpread.enabled "maxSkew" .Values.availability.topologySpread.maxSkew "minDomains" .Values.availability.topologySpread.minDomains "hard" (eq .Values.availability.topologySpread.whenUnsatisfiable "DoNotSchedule"))
  "security" (dict "serviceAccountTokenAutomount" .Values.serviceAccount.automount "runAsNonRoot" .Values.podSecurityContext.runAsNonRoot "readOnlyRootFilesystem" .Values.securityContext.readOnlyRootFilesystem "allowPrivilegeEscalation" .Values.securityContext.allowPrivilegeEscalation)
  "receivers" (dict "metricsEnabled" .Values.otlpReceiver.enabled "logsEnabled" .Values.otlpLogsReceiver.enabled "aiUsageEnabled" .Values.aiUsageReceiver.enabled "replicaCount" .Values.otlpIngest.replicaCount "tlsMode" .Values.otlpIngest.tls.mode "crlConfigured" (not (empty .Values.otlpIngest.tls.clientCrlExistingSecret)))
  "aiEconomics" (dict "attributionEnabled" .Values.aiAttribution.enabled "costEngineEnabled" .Values.aiCostEngine.enabled "savingsEngineEnabled" .Values.aiSavingsEngine.enabled "allocationReportingEnabled" .Values.aiAllocationReporting.enabled "attributionTestFixtures" .Values.aiAttribution.allowTestFixtures "priceTestFixtures" .Values.aiCostEngine.allowTestFixtures "priceQualificationRequired" .Values.aiCostEngine.requireQualification "savingsTestFixtures" .Values.aiSavingsEngine.allowTestFixtures)
  "dependencies" $dependencies
-}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "infra-intelligence.fullname" . }}-deployment-profile
  labels:
    {{- include "infra-intelligence.labels" . | nindent 4 }}
    app.kubernetes.io/component: deployment-profile
data:
  profile.json: {{ $profile | toJson | quote }}
