services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iip
      POSTGRES_USER: iip
      POSTGRES_PASSWORD: ${IIP_POSTGRES_PASSWORD:?set IIP_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iip -d iip"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  api:
    image: iip-local-platform:0.68.0
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        IIP_IMAGE_VERSION: "0.68.0"
        IIP_IMAGE_REVISION: development
    environment:
      IIP_DATABASE_URL: postgresql://iip@postgres:5432/iip
      IIP_DATABASE_AUTO_MIGRATE: "true"
      IIP_READINESS_DATABASE_TIMEOUT_SECONDS: "2"
      IIP_EVENT_DELIVERY_SLO_WINDOW_SECONDS: ${IIP_EVENT_DELIVERY_SLO_WINDOW_SECONDS:-3600}
      IIP_EVENT_DELIVERY_SLO_MAXIMUM_LATENCY_SECONDS: ${IIP_EVENT_DELIVERY_SLO_MAXIMUM_LATENCY_SECONDS:-60}
      IIP_EVENT_DELIVERY_SLO_MINIMUM_ATTAINMENT_BASIS_POINTS: ${IIP_EVENT_DELIVERY_SLO_MINIMUM_ATTAINMENT_BASIS_POINTS:-9900}
      IIP_EVENT_DELIVERY_SLO_MINIMUM_ELIGIBLE_EVENTS: ${IIP_EVENT_DELIVERY_SLO_MINIMUM_ELIGIBLE_EVENTS:-20}
      IIP_INVESTIGATION_COMPLETION_SLO_WINDOW_SECONDS: ${IIP_INVESTIGATION_COMPLETION_SLO_WINDOW_SECONDS:-3600}
      IIP_INVESTIGATION_COMPLETION_SLO_MAXIMUM_SECONDS: ${IIP_INVESTIGATION_COMPLETION_SLO_MAXIMUM_SECONDS:-300}
      IIP_INVESTIGATION_COMPLETION_SLO_MINIMUM_ATTAINMENT_BASIS_POINTS: ${IIP_INVESTIGATION_COMPLETION_SLO_MINIMUM_ATTAINMENT_BASIS_POINTS:-9900}
      IIP_INVESTIGATION_COMPLETION_SLO_MINIMUM_ELIGIBLE_JOBS: ${IIP_INVESTIGATION_COMPLETION_SLO_MINIMUM_ELIGIBLE_JOBS:-20}
      IIP_INVESTIGATION_MAX_OUTSTANDING_JOBS_PER_TENANT: ${IIP_INVESTIGATION_MAX_OUTSTANDING_JOBS_PER_TENANT:-1000}
      IIP_EVIDENCE_RETENTION_ENABLED: ${IIP_EVIDENCE_RETENTION_ENABLED:-false}
      IIP_EVIDENCE_RETENTION_EPHEMERAL_SECONDS: ${IIP_EVIDENCE_RETENTION_EPHEMERAL_SECONDS:-86400}
      IIP_EVIDENCE_RETENTION_STANDARD_SECONDS: ${IIP_EVIDENCE_RETENTION_STANDARD_SECONDS:-2592000}
      IIP_EVIDENCE_RETENTION_EXTENDED_SECONDS: ${IIP_EVIDENCE_RETENTION_EXTENDED_SECONDS:-31536000}
      IIP_EVIDENCE_RETENTION_BATCH_SIZE: ${IIP_EVIDENCE_RETENTION_BATCH_SIZE:-100}
      IIP_QUERY_AVAILABILITY_SLO_WINDOW_SECONDS: ${IIP_QUERY_AVAILABILITY_SLO_WINDOW_SECONDS:-3600}
      IIP_QUERY_AVAILABILITY_SLO_MINIMUM_BASIS_POINTS: ${IIP_QUERY_AVAILABILITY_SLO_MINIMUM_BASIS_POINTS:-9990}
      IIP_QUERY_AVAILABILITY_SLO_MINIMUM_ELIGIBLE_REQUESTS: ${IIP_QUERY_AVAILABILITY_SLO_MINIMUM_ELIGIBLE_REQUESTS:-100}
      IIP_AUTH_IDENTITIES_JSON: ${IIP_AUTH_IDENTITIES_JSON:?set IIP_AUTH_IDENTITIES_JSON}
      IIP_OTLP_RECEIVER_MODE: disabled
      IIP_OTEL_METRICS_ENABLED: ${IIP_OTEL_METRICS_ENABLED:-false}
      IIP_OTEL_TRACES_ENABLED: ${IIP_OTEL_TRACES_ENABLED:-false}
      IIP_TELEMETRY_METRICS_BACKEND: ${IIP_TELEMETRY_METRICS_BACKEND:-no-data}
      IIP_TELEMETRY_LOGS_BACKEND: ${IIP_TELEMETRY_LOGS_BACKEND:-no-data}
      IIP_PROMETHEUS_INTEGRATIONS_JSON: ${IIP_PROMETHEUS_INTEGRATIONS_JSON:-}
      IIP_PROMETHEUS_CREDENTIALS_JSON: ${IIP_PROMETHEUS_CREDENTIALS_JSON:-}
      IIP_LOKI_INTEGRATIONS_JSON: ${IIP_LOKI_INTEGRATIONS_JSON:-}
      IIP_LOKI_CREDENTIALS_JSON: ${IIP_LOKI_CREDENTIALS_JSON:-}
      IIP_OPENSEARCH_INTEGRATIONS_JSON: ${IIP_OPENSEARCH_INTEGRATIONS_JSON:-}
      IIP_OPENSEARCH_CREDENTIALS_JSON: ${IIP_OPENSEARCH_CREDENTIALS_JSON:-}
      IIP_CONTEXT_BACKEND: ${IIP_CONTEXT_BACKEND:-no-data}
      IIP_CONTEXT_INTEGRATIONS_JSON: ${IIP_CONTEXT_INTEGRATIONS_JSON:-}
      IIP_INVESTIGATION_SIGNAL_CATALOG_JSON: ${IIP_INVESTIGATION_SIGNAL_CATALOG_JSON:-}
      IIP_OTEL_INGESTION_ATTRIBUTE_MODE: ${IIP_OTEL_INGESTION_ATTRIBUTE_MODE:-source}
      IIP_OTEL_AI_ECONOMICS_ATTRIBUTE_MODE: ${IIP_OTEL_AI_ECONOMICS_ATTRIBUTE_MODE:-tenant-scope}
      IIP_OTEL_INVESTIGATION_ATTRIBUTE_MODE: ${IIP_OTEL_INVESTIGATION_ATTRIBUTE_MODE:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-60000}
      OTEL_METRIC_EXPORT_TIMEOUT: ${OTEL_METRIC_EXPORT_TIMEOUT:-10000}
      OTEL_BSP_SCHEDULE_DELAY: ${OTEL_BSP_SCHEDULE_DELAY:-5000}
      OTEL_BSP_EXPORT_TIMEOUT: ${OTEL_BSP_EXPORT_TIMEOUT:-10000}
      OTEL_BSP_MAX_QUEUE_SIZE: ${OTEL_BSP_MAX_QUEUE_SIZE:-2048}
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: ${OTEL_BSP_MAX_EXPORT_BATCH_SIZE:-512}
      IIP_TELEMETRY_HEALTH_INTERVAL_SECONDS: ${IIP_TELEMETRY_HEALTH_INTERVAL_SECONDS:-30}
      IIP_TELEMETRY_HEALTH_STALE_AFTER_SECONDS: ${IIP_TELEMETRY_HEALTH_STALE_AFTER_SECONDS:-120}
      IIP_TELEMETRY_HEALTH_RETENTION_SECONDS: ${IIP_TELEMETRY_HEALTH_RETENTION_SECONDS:-600}
      IIP_TELEMETRY_EXPORT_SLO_WINDOW_SECONDS: ${IIP_TELEMETRY_EXPORT_SLO_WINDOW_SECONDS:-3600}
      IIP_TELEMETRY_EXPORT_SLO_MINIMUM_ATTAINMENT_BASIS_POINTS: ${IIP_TELEMETRY_EXPORT_SLO_MINIMUM_ATTAINMENT_BASIS_POINTS:-9900}
      IIP_TELEMETRY_EXPORT_SLO_MINIMUM_ELIGIBLE_ATTEMPTS: ${IIP_TELEMETRY_EXPORT_SLO_MINIMUM_ELIGIBLE_ATTEMPTS:-20}
      IIP_TELEMETRY_EXPORT_SLO_RETENTION_SECONDS: ${IIP_TELEMETRY_EXPORT_SLO_RETENTION_SECONDS:-604800}
      IIP_TELEMETRY_EXPORT_BURN_RATE_SHORT_WINDOW_SECONDS: ${IIP_TELEMETRY_EXPORT_BURN_RATE_SHORT_WINDOW_SECONDS:-3600}
      IIP_TELEMETRY_EXPORT_BURN_RATE_LONG_WINDOW_SECONDS: ${IIP_TELEMETRY_EXPORT_BURN_RATE_LONG_WINDOW_SECONDS:-21600}
      IIP_TELEMETRY_EXPORT_BURN_RATE_MINIMUM_ATTAINMENT_BASIS_POINTS: ${IIP_TELEMETRY_EXPORT_BURN_RATE_MINIMUM_ATTAINMENT_BASIS_POINTS:-9900}
      IIP_TELEMETRY_EXPORT_BURN_RATE_MINIMUM_ELIGIBLE_ATTEMPTS: ${IIP_TELEMETRY_EXPORT_BURN_RATE_MINIMUM_ELIGIBLE_ATTEMPTS:-20}
      IIP_TELEMETRY_EXPORT_BURN_RATE_CRITICAL_HUNDREDTHS: ${IIP_TELEMETRY_EXPORT_BURN_RATE_CRITICAL_HUNDREDTHS:-600}
      IIP_COLLECTOR_QUEUE_LOSS_BINDING_JSON: ${IIP_COLLECTOR_QUEUE_LOSS_BINDING_JSON:-}
      IIP_COLLECTOR_QUEUE_LOSS_WINDOW_SECONDS: ${IIP_COLLECTOR_QUEUE_LOSS_WINDOW_SECONDS:-3600}
      IIP_COLLECTOR_QUEUE_LOSS_MAX_LOSS_BASIS_POINTS: ${IIP_COLLECTOR_QUEUE_LOSS_MAX_LOSS_BASIS_POINTS:-100}
      IIP_COLLECTOR_QUEUE_LOSS_MAX_QUEUE_UTILIZATION_BASIS_POINTS: ${IIP_COLLECTOR_QUEUE_LOSS_MAX_QUEUE_UTILIZATION_BASIS_POINTS:-8000}
      IIP_COLLECTOR_QUEUE_LOSS_MINIMUM_ELIGIBLE_ATTEMPTS: ${IIP_COLLECTOR_QUEUE_LOSS_MINIMUM_ELIGIBLE_ATTEMPTS:-20}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-infra-intelligence-api}
      PGPASSWORD: ${IIP_POSTGRES_PASSWORD:?set IIP_POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - ./context:/var/run/iip-context:ro
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  workflow-worker:
    image: iip-local-platform:0.68.0
    pull_policy: never
    command: ["python", "-m", "iip.surfaces.worker"]
    environment:
      IIP_DATABASE_URL: postgresql://iip@postgres:5432/iip
      IIP_DATABASE_AUTO_MIGRATE: "false"
      IIP_WORKER_ID: local-workflow-worker
      IIP_WORKER_TENANTS: local
      IIP_WORKER_LEASE_SECONDS: ${IIP_WORKER_LEASE_SECONDS:-30}
      IIP_WORKER_HEARTBEAT_SECONDS: ${IIP_WORKER_HEARTBEAT_SECONDS:-10}
      IIP_WORKER_RETRY_SECONDS: ${IIP_WORKER_RETRY_SECONDS:-5}
      IIP_WORKER_MAX_ATTEMPTS: ${IIP_WORKER_MAX_ATTEMPTS:-8}
      IIP_WORKER_INVESTIGATION_CONCURRENCY: ${IIP_WORKER_INVESTIGATION_CONCURRENCY:-4}
      IIP_WORKER_MAX_TENANT_CONCURRENCY: ${IIP_WORKER_MAX_TENANT_CONCURRENCY:-1}
      IIP_ACTION_RECONCILIATION_BATCH_SIZE: ${IIP_ACTION_RECONCILIATION_BATCH_SIZE:-100}
      IIP_EVIDENCE_RETENTION_ENABLED: ${IIP_EVIDENCE_RETENTION_ENABLED:-false}
      IIP_EVIDENCE_RETENTION_INTERVAL_SECONDS: ${IIP_EVIDENCE_RETENTION_INTERVAL_SECONDS:-3600}
      IIP_EVIDENCE_RETENTION_EPHEMERAL_SECONDS: ${IIP_EVIDENCE_RETENTION_EPHEMERAL_SECONDS:-86400}
      IIP_EVIDENCE_RETENTION_STANDARD_SECONDS: ${IIP_EVIDENCE_RETENTION_STANDARD_SECONDS:-2592000}
      IIP_EVIDENCE_RETENTION_EXTENDED_SECONDS: ${IIP_EVIDENCE_RETENTION_EXTENDED_SECONDS:-31536000}
      IIP_EVIDENCE_RETENTION_BATCH_SIZE: ${IIP_EVIDENCE_RETENTION_BATCH_SIZE:-100}
      IIP_AI_ATTRIBUTION_ENABLED: ${IIP_AI_ATTRIBUTION_ENABLED:-false}
      IIP_AI_ATTRIBUTION_POLICIES_JSON: ${IIP_AI_ATTRIBUTION_POLICIES_JSON:-}
      IIP_AI_ATTRIBUTION_ALLOW_TEST_FIXTURES: ${IIP_AI_ATTRIBUTION_ALLOW_TEST_FIXTURES:-false}
      IIP_AI_ATTRIBUTION_BATCH_SIZE: ${IIP_AI_ATTRIBUTION_BATCH_SIZE:-100}
      IIP_AI_ATTRIBUTION_INTERVAL_SECONDS: ${IIP_AI_ATTRIBUTION_INTERVAL_SECONDS:-10}
      IIP_AI_COST_ENGINE_ENABLED: ${IIP_AI_COST_ENGINE_ENABLED:-false}
      IIP_AI_PRICE_CATALOGS_JSON: ${IIP_AI_PRICE_CATALOGS_JSON:-}
      IIP_AI_PRICE_CATALOG_ALLOW_TEST_FIXTURES: ${IIP_AI_PRICE_CATALOG_ALLOW_TEST_FIXTURES:-false}
      IIP_AI_COST_BATCH_SIZE: ${IIP_AI_COST_BATCH_SIZE:-100}
      IIP_AI_COST_INTERVAL_SECONDS: ${IIP_AI_COST_INTERVAL_SECONDS:-10}
      IIP_AI_SAVINGS_ENGINE_ENABLED: ${IIP_AI_SAVINGS_ENGINE_ENABLED:-false}
      IIP_AI_SAVINGS_PROFILES_JSON: ${IIP_AI_SAVINGS_PROFILES_JSON:-}
      IIP_AI_SAVINGS_INTERVAL_SECONDS: ${IIP_AI_SAVINGS_INTERVAL_SECONDS:-60}
      IIP_EVENT_PUBLISHER_MODE: stdout-json
      IIP_OUTBOX_BATCH_SIZE: ${IIP_OUTBOX_BATCH_SIZE:-100}
      IIP_OUTBOX_LEASE_SECONDS: ${IIP_OUTBOX_LEASE_SECONDS:-30}
      IIP_OUTBOX_RETRY_BASE_SECONDS: ${IIP_OUTBOX_RETRY_BASE_SECONDS:-5}
      IIP_OUTBOX_RETRY_MAX_SECONDS: ${IIP_OUTBOX_RETRY_MAX_SECONDS:-300}
      IIP_OUTBOX_MAX_ATTEMPTS: ${IIP_OUTBOX_MAX_ATTEMPTS:-8}
      IIP_INGESTION_MONITOR_TARGETS_JSON: '{"targets":[{"tenantId":"local","sourceId":"kubernetes-local"}]}'
      IIP_INGESTION_MONITOR_INTERVAL_SECONDS: ${IIP_INGESTION_MONITOR_INTERVAL_SECONDS:-60}
      IIP_OTEL_METRICS_ENABLED: ${IIP_OTEL_METRICS_ENABLED:-false}
      IIP_OTEL_TRACES_ENABLED: ${IIP_OTEL_TRACES_ENABLED:-false}
      IIP_OTEL_INGESTION_ATTRIBUTE_MODE: ${IIP_OTEL_INGESTION_ATTRIBUTE_MODE:-source}
      IIP_OTEL_AI_ECONOMICS_ATTRIBUTE_MODE: ${IIP_OTEL_AI_ECONOMICS_ATTRIBUTE_MODE:-tenant-scope}
      IIP_OTEL_INVESTIGATION_ATTRIBUTE_MODE: ${IIP_OTEL_INVESTIGATION_ATTRIBUTE_MODE:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      IIP_TELEMETRY_HEALTH_INTERVAL_SECONDS: ${IIP_TELEMETRY_HEALTH_INTERVAL_SECONDS:-30}
      IIP_TELEMETRY_HEALTH_STALE_AFTER_SECONDS: ${IIP_TELEMETRY_HEALTH_STALE_AFTER_SECONDS:-120}
      IIP_TELEMETRY_HEALTH_RETENTION_SECONDS: ${IIP_TELEMETRY_HEALTH_RETENTION_SECONDS:-600}
      IIP_TELEMETRY_EXPORT_SLO_WINDOW_SECONDS: ${IIP_TELEMETRY_EXPORT_SLO_WINDOW_SECONDS:-3600}
      IIP_TELEMETRY_EXPORT_SLO_MINIMUM_ATTAINMENT_BASIS_POINTS: ${IIP_TELEMETRY_EXPORT_SLO_MINIMUM_ATTAINMENT_BASIS_POINTS:-9900}
      IIP_TELEMETRY_EXPORT_SLO_MINIMUM_ELIGIBLE_ATTEMPTS: ${IIP_TELEMETRY_EXPORT_SLO_MINIMUM_ELIGIBLE_ATTEMPTS:-20}
      IIP_TELEMETRY_EXPORT_SLO_RETENTION_SECONDS: ${IIP_TELEMETRY_EXPORT_SLO_RETENTION_SECONDS:-604800}
      IIP_TELEMETRY_EXPORT_BURN_RATE_SHORT_WINDOW_SECONDS: ${IIP_TELEMETRY_EXPORT_BURN_RATE_SHORT_WINDOW_SECONDS:-3600}
      IIP_TELEMETRY_EXPORT_BURN_RATE_LONG_WINDOW_SECONDS: ${IIP_TELEMETRY_EXPORT_BURN_RATE_LONG_WINDOW_SECONDS:-21600}
      IIP_TELEMETRY_EXPORT_BURN_RATE_MINIMUM_ATTAINMENT_BASIS_POINTS: ${IIP_TELEMETRY_EXPORT_BURN_RATE_MINIMUM_ATTAINMENT_BASIS_POINTS:-9900}
      IIP_TELEMETRY_EXPORT_BURN_RATE_MINIMUM_ELIGIBLE_ATTEMPTS: ${IIP_TELEMETRY_EXPORT_BURN_RATE_MINIMUM_ELIGIBLE_ATTEMPTS:-20}
      IIP_TELEMETRY_EXPORT_BURN_RATE_CRITICAL_HUNDREDTHS: ${IIP_TELEMETRY_EXPORT_BURN_RATE_CRITICAL_HUNDREDTHS:-600}
      IIP_COLLECTOR_QUEUE_LOSS_BINDING_JSON: ${IIP_COLLECTOR_QUEUE_LOSS_BINDING_JSON:-}
      IIP_COLLECTOR_QUEUE_LOSS_WINDOW_SECONDS: ${IIP_COLLECTOR_QUEUE_LOSS_WINDOW_SECONDS:-3600}
      IIP_COLLECTOR_QUEUE_LOSS_MAX_LOSS_BASIS_POINTS: ${IIP_COLLECTOR_QUEUE_LOSS_MAX_LOSS_BASIS_POINTS:-100}
      IIP_COLLECTOR_QUEUE_LOSS_MAX_QUEUE_UTILIZATION_BASIS_POINTS: ${IIP_COLLECTOR_QUEUE_LOSS_MAX_QUEUE_UTILIZATION_BASIS_POINTS:-8000}
      IIP_COLLECTOR_QUEUE_LOSS_MINIMUM_ELIGIBLE_ATTEMPTS: ${IIP_COLLECTOR_QUEUE_LOSS_MINIMUM_ELIGIBLE_ATTEMPTS:-20}
      OTEL_SERVICE_NAME: infra-intelligence-worker
      IIP_TELEMETRY_METRICS_BACKEND: ${IIP_TELEMETRY_METRICS_BACKEND:-no-data}
      IIP_TELEMETRY_LOGS_BACKEND: ${IIP_TELEMETRY_LOGS_BACKEND:-no-data}
      IIP_PROMETHEUS_INTEGRATIONS_JSON: ${IIP_PROMETHEUS_INTEGRATIONS_JSON:-}
      IIP_PROMETHEUS_CREDENTIALS_JSON: ${IIP_PROMETHEUS_CREDENTIALS_JSON:-}
      IIP_LOKI_INTEGRATIONS_JSON: ${IIP_LOKI_INTEGRATIONS_JSON:-}
      IIP_LOKI_CREDENTIALS_JSON: ${IIP_LOKI_CREDENTIALS_JSON:-}
      IIP_OPENSEARCH_INTEGRATIONS_JSON: ${IIP_OPENSEARCH_INTEGRATIONS_JSON:-}
      IIP_OPENSEARCH_CREDENTIALS_JSON: ${IIP_OPENSEARCH_CREDENTIALS_JSON:-}
      IIP_CONTEXT_BACKEND: ${IIP_CONTEXT_BACKEND:-no-data}
      IIP_CONTEXT_INTEGRATIONS_JSON: ${IIP_CONTEXT_INTEGRATIONS_JSON:-}
      IIP_INVESTIGATION_SIGNAL_CATALOG_JSON: ${IIP_INVESTIGATION_SIGNAL_CATALOG_JSON:-}
      PGPASSWORD: ${IIP_POSTGRES_PASSWORD:?set IIP_POSTGRES_PASSWORD}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - ./context:/var/run/iip-context:ro
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: otel/opentelemetry-collector:0.158.0
    profiles: ["telemetry"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector-test.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:14318:4318"

  prometheus:
    image: prom/prometheus:v3.13.1
    profiles: ["telemetry-query"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus-test.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:19090:9090"
    read_only: true
    tmpfs:
      - /prometheus:uid=65534,gid=65534,mode=0750

volumes:
  postgres-data:
