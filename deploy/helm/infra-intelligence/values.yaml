replicaCount: 1

image:
  repository: ghcr.io/replace-me/infra-intelligence-platform
  pullPolicy: IfNotPresent
  tag: "0.41.0"
  digest: ""

worker:
  enabled: false
  replicaCount: 1
  tenants: []
  leaseSeconds: 30
  heartbeatSeconds: 10
  retrySeconds: 5
  maxAttempts: 8
  investigationConcurrency: 4
  maxTenantInvestigationConcurrency: 1
  actionReconciliationBatchSize: 100
  ingestionMonitorTargets: []
  ingestionMonitorIntervalSeconds: 60
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

eventPublisher:
  mode: disabled
  batchSize: 100
  leaseSeconds: 30
  retryBaseSeconds: 5
  retryMaxSeconds: 300
  maxAttempts: 8
  httpsWebhook:
    endpoint: ""
    timeoutSeconds: 5
    maxResponseBytes: 4096
    tokenExistingSecret: ""
    tokenSecretKey: token
    tokenMountPath: /var/run/iip-event-publisher-token
    caBundleExistingSecret: ""
    caBundleSecretKey: ca.crt
    caBundleMountPath: /var/run/iip-event-publisher-ca

eventDeliverySlo:
  windowSeconds: 3600
  maximumDeliveryLatencySeconds: 60
  minimumAttainmentBasisPoints: 9900
  minimumEligibleEvents: 20

investigationCompletionSlo:
  windowSeconds: 3600
  maximumCompletionSeconds: 300
  minimumAttainmentBasisPoints: 9900
  minimumEligibleJobs: 20

investigationQueue:
  maxOutstandingJobsPerTenant: 1000

evidenceRetention:
  enabled: false
  intervalSeconds: 3600
  ephemeralSeconds: 86400
  standardSeconds: 2592000
  extendedSeconds: 31536000
  batchSize: 100

queryAvailabilitySlo:
  windowSeconds: 3600
  minimumAvailabilityBasisPoints: 9990
  minimumEligibleRequests: 100

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: http

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: /
  pathType: Prefix
  tls:
    existingSecret: ""
  tlsRedirectAnnotation: ""
  tlsRedirectValue: "true"

config:
  httpHost: 0.0.0.0
  httpPort: 8080

database:
  existingSecret: ""
  secretKey: database-url
  migrations:
    enabled: false
    backoffLimit: 2
    activeDeadlineSeconds: 300
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

backup:
  enabled: false
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  suspend: false
  startingDeadlineSeconds: 900
  activeDeadlineSeconds: 3600
  backoffLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  prefix: iip
  destination:
    existingClaim: ""
    mountPath: /var/lib/iip-backups
  image:
    repository: postgres
    digest: sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi

auth:
  mode: local-hashed
  existingSecret: iip-auth
  secretKey: identities-json
  oidc:
    configJson: '{}'
    caBundleExistingSecret: ""
    caBundleSecretKey: ca.crt
    caBundleMountPath: /var/run/iip-oidc-ca

policy:
  mode: local
  externalHttp:
    configJson: '{}'
    bearerTokenExistingSecret: ""
    bearerTokenSecretKey: token
    bearerTokenMountPath: /var/run/iip-policy-token
    caBundleExistingSecret: ""
    caBundleSecretKey: ca.crt
    caBundleMountPath: /var/run/iip-policy-ca

credentialBroker:
  mode: static
  externalHttp:
    configJson: '{}'
    audience: iip-credential-broker
    tokenExpirationSeconds: 600
    identityMountPath: /var/run/iip-credential-broker-identity
    caBundleExistingSecret: ""
    caBundleSecretKey: ca.crt
    caBundleMountPath: /var/run/iip-credential-broker-ca

telemetry:
  metricsEnabled: false
  tracesEnabled: false
  otlpEndpoint: ""
  protocol: http/protobuf
  attributeMode: source
  investigationAttributeMode: none
  serviceName: infra-intelligence-api
  workerServiceName: infra-intelligence-worker
  exportIntervalMillis: 60000
  exportTimeoutMillis: 10000
  traceScheduleDelayMillis: 5000
  traceExportTimeoutMillis: 10000
  traceMaxQueueSize: 2048
  traceMaxExportBatchSize: 512
  existingSecret: ""
  headersSecretKey: otlp-headers

telemetryEvidence:
  backend: no-data
  prometheus:
    integrationsJson: '{"integrations":[]}'
    credentialsExistingSecret: ""
    credentialsSecretKey: prometheus-credentials-json

logEvidence:
  backend: no-data
  loki:
    integrationsJson: '{"integrations":[]}'
    credentialsExistingSecret: ""
    credentialsSecretKey: loki-credentials-json

kubernetesEventEvidence:
  backend: no-data
  integrationsJson: '{"integrations":[]}'
  credentialsExistingSecret: ""
  credentialsSecretKey: kubernetes-events-credentials-json
  caBundleExistingSecret: ""
  caBundleSecretKey: ca.crt
  caBundleMountPath: /var/run/iip-kubernetes-events

kubernetesActions:
  executor: dry-run
  integrationsJson: '{"integrations":[]}'
  credentialsExistingSecret: ""
  credentialsSecretKey: kubernetes-actions-credentials-json
  caBundleExistingSecret: ""
  caBundleSecretKey: ca.crt
  caBundleMountPath: /var/run/iip-kubernetes-actions

contextEvidence:
  backend: no-data
  integrationsExistingSecret: ""
  integrationsSecretKey: context-integrations-json
  documentsExistingConfigMap: ""
  documentsMountPath: /var/run/iip-context

investigationSignalCatalog:
  existingSecret: ""
  secretKey: investigation-signal-catalog-json

otlpReceiver:
  enabled: false
  channelsExistingSecret: ""
  channelsSecretKey: otlp-receiver-channels-json

otlpLogsReceiver:
  enabled: false
  channelsExistingSecret: ""
  channelsSecretKey: otlp-logs-receiver-channels-json

otlpIngest:
  replicaCount: 1
  httpHost: 0.0.0.0
  httpPort: 4318
  service:
    type: ClusterIP
    port: 4318
  maxRequestsPerSecond: 50
  requestBurst: 100
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 3
    databaseTimeoutSeconds: 2

networkPolicy:
  enabled: false
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: iip-system
  ingressController:
    enabled: false
    namespaceSelector:
      kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      app.kubernetes.io/component: controller
  otlpReceiverIngress:
    enabled: false
    namespaceSelector:
      kubernetes.io/metadata.name: observability
    podSelector:
      app.kubernetes.io/name: opentelemetry-collector
  databaseEgress:
    enabled: false
    cidr: ""
    port: 5432
    namespaceSelector:
      kubernetes.io/metadata.name: iip-system
    podSelector:
      app.kubernetes.io/name: postgresql
  otlpEgress:
    enabled: false
    port: 4318
    namespaceSelector:
      kubernetes.io/metadata.name: observability
    podSelector:
      app.kubernetes.io/name: opentelemetry-collector
  prometheusEgress:
    enabled: false
    port: 9090
    namespaceSelector:
      kubernetes.io/metadata.name: observability
    podSelector:
      app.kubernetes.io/name: prometheus
  lokiEgress:
    enabled: false
    port: 3100
    namespaceSelector:
      kubernetes.io/metadata.name: observability
    podSelector:
      app.kubernetes.io/name: loki
  kubernetesApiEgress:
    enabled: false
    cidr: 10.96.0.1/32
    port: 443
  credentialBrokerEgress:
    enabled: false
    cidr: 10.96.0.1/32
    port: 8443
  oidcEgress:
    enabled: false
    cidr: 10.96.0.1/32
    port: 443
  policyEgress:
    enabled: false
    cidr: 10.96.0.1/32
    port: 443
  eventPublisherEgress:
    enabled: false
    cidr: 10.96.0.1/32
    port: 443

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
