name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Select automatic, full, or chart/documentation checks
        required: true
        default: auto
        type: choice
        options:
          - auto
          - full
          - charts

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
      reason: ${{ steps.selection.outputs.reason }}
      run_full: ${{ steps.selection.outputs.run_full }}
      run_lightweight: ${{ steps.selection.outputs.run_lightweight }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from the validated Git change set
        id: selection
        env:
          IIP_CI_EVENT_NAME: ${{ github.event_name }}
          IIP_CI_SCOPE: ${{ inputs.scope || 'auto' }}
          IIP_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          IIP_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/select_ci_checks.py >> "$GITHUB_OUTPUT"

  charts-and-docs:
    needs: select-checks
    if: needs.select-checks.outputs.run_lightweight == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/verify.txt
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3
      - run: python -m pip install --requirement requirements/verify.txt
      - name: Run focused chart and documentation verification
        run: make verify-charts

  community-recovery:
    needs: select-checks
    if: needs.select-checks.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/verify.txt
      - run: python -m pip install --requirement requirements/verify.txt
      - name: Recover an owned synthetic installation without touching another project
        run: make test-community-recovery
      - name: Rotate trust, prove rejection and rollback, and recover settled generations
        run: make test-community-trust

  learning-preview:
    needs: select-checks
    if: needs.select-checks.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Start and verify the Docker-only synthetic learning flow
        run: sh scripts/learning.sh up
      - name: Inspect learning services
        run: sh scripts/learning.sh status
      - name: Remove only this disposable learning project
        if: always()
        run: sh scripts/learning.sh down

  verify:
    needs: select-checks
    if: needs.select-checks.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IIP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iip_test
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: iip_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/verify.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3
      - run: python -m pip install --requirement requirements/verify.txt
      - run: make verify-workflows
      - run: make verify
      - run: PYTHONPATH=src python scripts/run_capacity_certification.py --database-url "$IIP_TEST_DATABASE_URL"

  plugin-compatibility:
    needs: select-checks
    if: needs.select-checks.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/verify.txt
      - run: python -m pip install --requirement requirements/verify.txt
      - run: make test-plugin-compatibility

  identity-and-policy-compatibility:
    needs: select-checks
    if: needs.select-checks.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/verify.txt
      - run: python -m pip install --requirement requirements/verify.txt
      - run: make test-credential-broker
      - run: make test-oidc
      - run: make test-policy-engine

  postgresql-continuity:
    needs: select-checks
    if: needs.select-checks.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/verify.txt
      - run: python -m pip install --requirement requirements/verify.txt
      - run: make test-postgres-continuity
      - run: make test-postgres-tls

  instrumentation-compatibility:
    needs: select-checks
    if: needs.select-checks.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: make test-bedrock-instrumentation
      - run: make test-openai-instrumentation

  release-supply-chain-compatibility:
    needs: select-checks
    if: needs.select-checks.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/verify.txt
      - run: python -m pip install --requirement requirements/verify.txt
      - run: make test-release-publication
      - run: make test-release-signatures
      - run: make test-release-vulnerabilities
