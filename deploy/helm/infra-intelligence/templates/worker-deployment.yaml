{{- if .Values.worker.enabled }}
{{- $databaseSecret := required "database.existingSecret is required when worker.enabled=true" .Values.database.existingSecret }}
{{- if not .Values.worker.tenants }}{{ fail "worker.tenants must contain at least one explicit tenant when worker.enabled=true" }}{{- end }}
{{- if and (ne .Values.eventPublisher.mode "disabled") (ne .Values.eventPublisher.mode "https-webhook") }}{{ fail "eventPublisher.mode must be disabled or https-webhook" }}{{- end }}
{{- if eq .Values.eventPublisher.mode "https-webhook" }}
{{- $eventEndpoint := required "eventPublisher.httpsWebhook.endpoint is required in https-webhook mode" .Values.eventPublisher.httpsWebhook.endpoint }}
{{- $eventTokenSecret := required "eventPublisher.httpsWebhook.tokenExistingSecret is required in https-webhook mode" .Values.eventPublisher.httpsWebhook.tokenExistingSecret }}
{{- if and .Values.networkPolicy.enabled (not .Values.networkPolicy.eventPublisherEgress.enabled) }}{{ fail "networkPolicy.eventPublisherEgress.enabled must be true for https-webhook publishing when NetworkPolicy is enabled" }}{{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled (not .Values.networkPolicy.databaseEgress.enabled) }}{{ fail "networkPolicy.databaseEgress.enabled must be true for the worker when NetworkPolicy is enabled" }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infra-intelligence.fullname" . }}-worker
  labels:
    {{- include "infra-intelligence.labels" . | nindent 4 }}
    app.kubernetes.io/component: workflow-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  minReadySeconds: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "infra-intelligence.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: workflow-worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "infra-intelligence.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: workflow-worker
    spec:
      serviceAccountName: {{ include "infra-intelligence.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: workflow-worker
          image: {{ include "infra-intelligence.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "iip.surfaces.worker"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "infra-intelligence.fullname" . }}
          env:
            - name: IIP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $databaseSecret | quote }}
                  key: {{ .Values.database.secretKey | quote }}
            - name: IIP_DATABASE_AUTO_MIGRATE
              value: "false"
            - name: IIP_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: IIP_WORKER_TENANTS
              value: {{ join "," .Values.worker.tenants | quote }}
            - name: IIP_AI_ATTRIBUTION_ENABLED
              value: {{ .Values.aiAttribution.enabled | quote }}
            {{- if .Values.aiAttribution.enabled }}
            - name: IIP_AI_ATTRIBUTION_POLICIES_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aiAttribution.policiesExistingSecret | quote }}
                  key: {{ .Values.aiAttribution.policiesSecretKey | quote }}
            - name: IIP_AI_ATTRIBUTION_ALLOW_TEST_FIXTURES
              value: {{ .Values.aiAttribution.allowTestFixtures | quote }}
            - name: IIP_AI_ATTRIBUTION_BATCH_SIZE
              value: {{ .Values.aiAttribution.batchSize | quote }}
            - name: IIP_AI_ATTRIBUTION_INTERVAL_SECONDS
              value: {{ .Values.aiAttribution.intervalSeconds | quote }}
            {{- end }}
            - name: IIP_AI_COST_ENGINE_ENABLED
              value: {{ .Values.aiCostEngine.enabled | quote }}
            {{- if .Values.aiCostEngine.enabled }}
            - name: IIP_AI_PRICE_CATALOGS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aiCostEngine.catalogsExistingSecret | quote }}
                  key: {{ .Values.aiCostEngine.catalogsSecretKey | quote }}
            - name: IIP_AI_PRICE_CATALOG_ALLOW_TEST_FIXTURES
              value: {{ .Values.aiCostEngine.allowTestFixtures | quote }}
            - name: IIP_AI_COST_BATCH_SIZE
              value: {{ .Values.aiCostEngine.batchSize | quote }}
            - name: IIP_AI_COST_INTERVAL_SECONDS
              value: {{ .Values.aiCostEngine.intervalSeconds | quote }}
            {{- end }}
            - name: IIP_AI_SAVINGS_ENGINE_ENABLED
              value: {{ .Values.aiSavingsEngine.enabled | quote }}
            {{- if .Values.aiSavingsEngine.enabled }}
            - name: IIP_AI_SAVINGS_PROFILES_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aiSavingsEngine.profilesExistingSecret | quote }}
                  key: {{ .Values.aiSavingsEngine.profilesSecretKey | quote }}
            - name: IIP_AI_SAVINGS_ALLOW_TEST_FIXTURES
              value: {{ .Values.aiSavingsEngine.allowTestFixtures | quote }}
            - name: IIP_AI_SAVINGS_INTERVAL_SECONDS
              value: {{ .Values.aiSavingsEngine.intervalSeconds | quote }}
            {{- end }}
            - name: IIP_WORKER_LEASE_SECONDS
              value: {{ .Values.worker.leaseSeconds | quote }}
            - name: IIP_WORKER_HEARTBEAT_SECONDS
              value: {{ .Values.worker.heartbeatSeconds | quote }}
            - name: IIP_WORKER_RETRY_SECONDS
              value: {{ .Values.worker.retrySeconds | quote }}
            - name: IIP_WORKER_MAX_ATTEMPTS
              value: {{ .Values.worker.maxAttempts | quote }}
            - name: IIP_WORKER_INVESTIGATION_CONCURRENCY
              value: {{ .Values.worker.investigationConcurrency | quote }}
            - name: IIP_WORKER_MAX_TENANT_CONCURRENCY
              value: {{ .Values.worker.maxTenantInvestigationConcurrency | quote }}
            - name: IIP_ACTION_RECONCILIATION_BATCH_SIZE
              value: {{ .Values.worker.actionReconciliationBatchSize | quote }}
            - name: IIP_EVENT_PUBLISHER_MODE
              value: {{ .Values.eventPublisher.mode | quote }}
            - name: IIP_OUTBOX_BATCH_SIZE
              value: {{ .Values.eventPublisher.batchSize | quote }}
            - name: IIP_OUTBOX_LEASE_SECONDS
              value: {{ .Values.eventPublisher.leaseSeconds | quote }}
            - name: IIP_OUTBOX_RETRY_BASE_SECONDS
              value: {{ .Values.eventPublisher.retryBaseSeconds | quote }}
            - name: IIP_OUTBOX_RETRY_MAX_SECONDS
              value: {{ .Values.eventPublisher.retryMaxSeconds | quote }}
            - name: IIP_OUTBOX_MAX_ATTEMPTS
              value: {{ .Values.eventPublisher.maxAttempts | quote }}
            {{- if eq .Values.eventPublisher.mode "https-webhook" }}
            - name: IIP_EVENT_PUBLISHER_CONFIG_JSON
              {{- if .Values.eventPublisher.httpsWebhook.caBundleExistingSecret }}
              value: {{ dict "endpoint" .Values.eventPublisher.httpsWebhook.endpoint "tenantIds" .Values.worker.tenants "bearerTokenPath" (printf "%s/token" .Values.eventPublisher.httpsWebhook.tokenMountPath) "caBundlePath" (printf "%s/ca.crt" .Values.eventPublisher.httpsWebhook.caBundleMountPath) "timeoutSeconds" .Values.eventPublisher.httpsWebhook.timeoutSeconds "maxResponseBytes" .Values.eventPublisher.httpsWebhook.maxResponseBytes | toJson | quote }}
              {{- else }}
              value: {{ dict "endpoint" .Values.eventPublisher.httpsWebhook.endpoint "tenantIds" .Values.worker.tenants "bearerTokenPath" (printf "%s/token" .Values.eventPublisher.httpsWebhook.tokenMountPath) "timeoutSeconds" .Values.eventPublisher.httpsWebhook.timeoutSeconds "maxResponseBytes" .Values.eventPublisher.httpsWebhook.maxResponseBytes | toJson | quote }}
              {{- end }}
            {{- end }}
            {{- if .Values.worker.ingestionMonitorTargets }}
            - name: IIP_INGESTION_MONITOR_TARGETS_JSON
              value: {{ dict "targets" .Values.worker.ingestionMonitorTargets | toJson | quote }}
            - name: IIP_INGESTION_MONITOR_INTERVAL_SECONDS
              value: {{ .Values.worker.ingestionMonitorIntervalSeconds | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.telemetry.workerServiceName | quote }}
            {{- if .Values.telemetry.existingSecret }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.telemetry.existingSecret | quote }}
                  key: {{ .Values.telemetry.headersSecretKey | quote }}
            {{- end }}
            {{- if .Values.telemetryEvidence.prometheus.credentialsExistingSecret }}
            - name: IIP_PROMETHEUS_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.telemetryEvidence.prometheus.credentialsExistingSecret | quote }}
                  key: {{ .Values.telemetryEvidence.prometheus.credentialsSecretKey | quote }}
            {{- end }}
            {{- if .Values.logEvidence.loki.credentialsExistingSecret }}
            - name: IIP_LOKI_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.logEvidence.loki.credentialsExistingSecret | quote }}
                  key: {{ .Values.logEvidence.loki.credentialsSecretKey | quote }}
            {{- end }}
            {{- if .Values.logEvidence.opensearch.credentialsExistingSecret }}
            - name: IIP_OPENSEARCH_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.logEvidence.opensearch.credentialsExistingSecret | quote }}
                  key: {{ .Values.logEvidence.opensearch.credentialsSecretKey | quote }}
            {{- end }}
            {{- if .Values.kubernetesEventEvidence.credentialsExistingSecret }}
            - name: IIP_KUBERNETES_EVENTS_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kubernetesEventEvidence.credentialsExistingSecret | quote }}
                  key: {{ .Values.kubernetesEventEvidence.credentialsSecretKey | quote }}
            {{- end }}
            {{- if .Values.contextEvidence.integrationsExistingSecret }}
            - name: IIP_CONTEXT_INTEGRATIONS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.contextEvidence.integrationsExistingSecret | quote }}
                  key: {{ .Values.contextEvidence.integrationsSecretKey | quote }}
            {{- end }}
            {{- if and (eq .Values.contextEvidence.backend "github") .Values.contextEvidence.credentialsExistingSecret }}
            - name: IIP_GITHUB_CONTEXT_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.contextEvidence.credentialsExistingSecret | quote }}
                  key: {{ .Values.contextEvidence.credentialsSecretKey | quote }}
            {{- end }}
            {{- if .Values.investigationSignalCatalog.existingSecret }}
            - name: IIP_INVESTIGATION_SIGNAL_CATALOG_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.investigationSignalCatalog.existingSecret | quote }}
                  key: {{ .Values.investigationSignalCatalog.secretKey | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.credentialBroker.mode "external-http" }}
            - name: credential-broker-identity
              mountPath: {{ .Values.credentialBroker.externalHttp.identityMountPath | quote }}
              readOnly: true
            {{- if .Values.credentialBroker.externalHttp.caBundleExistingSecret }}
            - name: credential-broker-ca
              mountPath: {{ .Values.credentialBroker.externalHttp.caBundleMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if eq .Values.policy.mode "external-http" }}
            {{- if .Values.policy.externalHttp.bearerTokenExistingSecret }}
            - name: policy-token
              mountPath: {{ .Values.policy.externalHttp.bearerTokenMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.policy.externalHttp.caBundleExistingSecret }}
            - name: policy-ca
              mountPath: {{ .Values.policy.externalHttp.caBundleMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.kubernetesEventEvidence.caBundleExistingSecret }}
            - name: kubernetes-events-ca
              mountPath: {{ .Values.kubernetesEventEvidence.caBundleMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.contextEvidence.documentsExistingConfigMap }}
            - name: context-documents
              mountPath: {{ .Values.contextEvidence.documentsMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.contextEvidence.backend "github") .Values.contextEvidence.caBundleExistingSecret }}
            - name: github-context-ca
              mountPath: {{ .Values.contextEvidence.caBundleMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if eq .Values.eventPublisher.mode "https-webhook" }}
            - name: event-publisher-token
              mountPath: {{ .Values.eventPublisher.httpsWebhook.tokenMountPath | quote }}
              readOnly: true
            {{- if .Values.eventPublisher.httpsWebhook.caBundleExistingSecret }}
            - name: event-publisher-ca
              mountPath: {{ .Values.eventPublisher.httpsWebhook.caBundleMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.credentialBroker.mode "external-http" }}
        - name: credential-broker-identity
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.credentialBroker.externalHttp.audience | quote }}
                  expirationSeconds: {{ .Values.credentialBroker.externalHttp.tokenExpirationSeconds }}
                  path: token
        {{- if .Values.credentialBroker.externalHttp.caBundleExistingSecret }}
        - name: credential-broker-ca
          secret:
            secretName: {{ .Values.credentialBroker.externalHttp.caBundleExistingSecret | quote }}
            items:
              - key: {{ .Values.credentialBroker.externalHttp.caBundleSecretKey | quote }}
                path: ca.crt
        {{- end }}
        {{- end }}
        {{- if and (eq .Values.policy.mode "external-http") .Values.policy.externalHttp.bearerTokenExistingSecret }}
        - name: policy-token
          secret:
            secretName: {{ .Values.policy.externalHttp.bearerTokenExistingSecret | quote }}
            items:
              - key: {{ .Values.policy.externalHttp.bearerTokenSecretKey | quote }}
                path: token
        {{- end }}
        {{- if and (eq .Values.policy.mode "external-http") .Values.policy.externalHttp.caBundleExistingSecret }}
        - name: policy-ca
          secret:
            secretName: {{ .Values.policy.externalHttp.caBundleExistingSecret | quote }}
            items:
              - key: {{ .Values.policy.externalHttp.caBundleSecretKey | quote }}
                path: ca.crt
        {{- end }}
        {{- if .Values.kubernetesEventEvidence.caBundleExistingSecret }}
        - name: kubernetes-events-ca
          secret:
            secretName: {{ .Values.kubernetesEventEvidence.caBundleExistingSecret | quote }}
            items:
              - key: {{ .Values.kubernetesEventEvidence.caBundleSecretKey | quote }}
                path: ca.crt
        {{- end }}
        {{- if .Values.contextEvidence.documentsExistingConfigMap }}
        - name: context-documents
          configMap:
            name: {{ .Values.contextEvidence.documentsExistingConfigMap | quote }}
        {{- end }}
        {{- if and (eq .Values.contextEvidence.backend "github") .Values.contextEvidence.caBundleExistingSecret }}
        - name: github-context-ca
          secret:
            secretName: {{ .Values.contextEvidence.caBundleExistingSecret | quote }}
            items:
              - key: {{ .Values.contextEvidence.caBundleSecretKey | quote }}
                path: ca.crt
        {{- end }}
        {{- if eq .Values.eventPublisher.mode "https-webhook" }}
        - name: event-publisher-token
          secret:
            secretName: {{ .Values.eventPublisher.httpsWebhook.tokenExistingSecret | quote }}
            items:
              - key: {{ .Values.eventPublisher.httpsWebhook.tokenSecretKey | quote }}
                path: token
        {{- if .Values.eventPublisher.httpsWebhook.caBundleExistingSecret }}
        - name: event-publisher-ca
          secret:
            secretName: {{ .Values.eventPublisher.httpsWebhook.caBundleExistingSecret | quote }}
            items:
              - key: {{ .Values.eventPublisher.httpsWebhook.caBundleSecretKey | quote }}
                path: ca.crt
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.availability.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.availability.topologySpread.maxSkew }}
          {{- if eq .Values.availability.topologySpread.whenUnsatisfiable "DoNotSchedule" }}
          minDomains: {{ .Values.availability.topologySpread.minDomains }}
          {{- end }}
          topologyKey: {{ .Values.availability.topologySpread.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.availability.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "infra-intelligence.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: workflow-worker
      {{- end }}
{{- end }}
