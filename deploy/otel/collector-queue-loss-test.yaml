receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  # Deliberately unreachable: every attempt fails immediately (connection
  # refused on the collector's own loopback), producing real, deterministic
  # otelcol_exporter_send_failed_* counters and a real queue depth without
  # depending on any external network reachability.
  otlphttp/iip:
    endpoint: http://127.0.0.1:1/v1
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 100
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 5s
    timeout: 1s

service:
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/iip]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/iip]
