{{- if and .Values.worker.enabled (ge (int .Values.worker.heartbeatSeconds) (int .Values.worker.leaseSeconds)) }}
{{- fail "worker.heartbeatSeconds must be less than worker.leaseSeconds" }}
{{- end }}
{{- if gt (int .Values.eventPublisher.retryBaseSeconds) (int .Values.eventPublisher.retryMaxSeconds) }}
{{- fail "eventPublisher.retryBaseSeconds must not exceed eventPublisher.retryMaxSeconds" }}
{{- end }}
{{- if ge (int .Values.eventDeliverySlo.maximumDeliveryLatencySeconds) (int .Values.eventDeliverySlo.windowSeconds) }}
{{- fail "eventDeliverySlo.maximumDeliveryLatencySeconds must be less than eventDeliverySlo.windowSeconds" }}
{{- end }}
{{- if gt (int .Values.telemetry.traceMaxExportBatchSize) (int .Values.telemetry.traceMaxQueueSize) }}
{{- fail "telemetry.traceMaxExportBatchSize must not exceed telemetry.traceMaxQueueSize" }}
{{- end }}
{{- if and (or .Values.telemetry.metricsEnabled .Values.telemetry.tracesEnabled) (not .Values.telemetry.otlpEndpoint) }}
{{- fail "telemetry.otlpEndpoint is required when telemetry export is enabled" }}
{{- end }}
{{- if eq .Values.auth.mode "local-hashed" }}
{{- if not .Values.auth.existingSecret }}
{{- fail "auth.existingSecret is required in local-hashed mode" }}
{{- end }}
{{- else if eq .Values.auth.oidc.configJson "{}" }}
{{- fail "auth.oidc.configJson must contain a reviewed OIDC configuration in oidc mode" }}
{{- end }}
{{- if and (eq .Values.policy.mode "external-http") (eq .Values.policy.externalHttp.configJson "{}") }}
{{- fail "policy.externalHttp.configJson is required in external-http mode" }}
{{- end }}
{{- if and (eq .Values.credentialBroker.mode "external-http") (eq .Values.credentialBroker.externalHttp.configJson "{}") }}
{{- fail "credentialBroker.externalHttp.configJson is required in external-http mode" }}
{{- end }}
{{- if and .Values.otlpReceiver.enabled (not .Values.otlpReceiver.channelsExistingSecret) }}
{{- fail "otlpReceiver.channelsExistingSecret is required when the metrics receiver is enabled" }}
{{- end }}
{{- if and .Values.otlpLogsReceiver.enabled (not .Values.otlpLogsReceiver.channelsExistingSecret) }}
{{- fail "otlpLogsReceiver.channelsExistingSecret is required when the logs receiver is enabled" }}
{{- end }}
{{- if .Values.backup.enabled }}
{{- if not .Values.database.existingSecret }}
{{- fail "database.existingSecret is required when backup.enabled=true" }}
{{- end }}
{{- if not .Values.backup.destination.existingClaim }}
{{- fail "backup.destination.existingClaim is required when backup.enabled=true" }}
{{- end }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "networkPolicy.enabled must be true when backup is enabled" }}
{{- end }}
{{- if not .Values.networkPolicy.databaseEgress.enabled }}
{{- fail "networkPolicy.databaseEgress.enabled must be true when backup is enabled" }}
{{- end }}
{{- end }}
{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.className }}
{{- fail "ingress.className is required when ingress is enabled" }}
{{- end }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.host is required when ingress is enabled" }}
{{- end }}
{{- if not .Values.ingress.tls.existingSecret }}
{{- fail "ingress.tls.existingSecret is required when ingress is enabled" }}
{{- end }}
{{- if not .Values.ingress.tlsRedirectAnnotation }}
{{- fail "ingress.tlsRedirectAnnotation is required when ingress is enabled" }}
{{- end }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "networkPolicy.enabled must be true when ingress is enabled" }}
{{- end }}
{{- if not .Values.networkPolicy.ingressController.enabled }}
{{- fail "networkPolicy.ingressController.enabled must be true when ingress is enabled" }}
{{- end }}
{{- if or (not .Values.networkPolicy.ingressController.namespaceSelector) (not .Values.networkPolicy.ingressController.podSelector) }}
{{- fail "networkPolicy.ingressController selectors must be explicit when ingress is enabled" }}
{{- end }}
{{- end }}
