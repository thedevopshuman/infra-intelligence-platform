replicaCount: 1

image:
  repository: ghcr.io/replace-me/infra-intelligence-platform
  pullPolicy: IfNotPresent
  tag: "0.25.0"

worker:
  enabled: false
  replicaCount: 1
  tenants: []
  leaseSeconds: 30
  heartbeatSeconds: 10
  retrySeconds: 5
  maxAttempts: 8
  actionReconciliationBatchSize: 100
  ingestionMonitorTargets: []
  ingestionMonitorIntervalSeconds: 60
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

eventPublisher:
  mode: disabled
  batchSize: 100
  leaseSeconds: 30
  retryBaseSeconds: 5
  retryMaxSeconds: 300
  httpsWebhook:
    endpoint: ""
    timeoutSeconds: 5
    maxResponseBytes: 4096
    tokenExistingSecret: ""
    tokenSecretKey: token
    tokenMountPath: /var/run/iip-event-publisher-token
    caBundleExistingSecret: ""
    caBundleSecretKey: ca.crt
    caBundleMountPath: /var/run/iip-event-publisher-ca

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: http

config:
  httpHost: 0.0.0.0
  httpPort: 8080

database:
  existingSecret: ""
  secretKey: database-url
  migrations:
    enabled: false
    backoffLimit: 2
    activeDeadlineSeconds: 300
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

auth:
  mode: local-hashed
  existingSecret: ""
  secretKey: identities-json
  oidc:
    configJson: '{}'
    caBundleExistingSecret: ""
    caBundleSecretKey: ca.crt
    caBundleMountPath: /var/run/iip-oidc-ca

policy:
  mode: local
  externalHttp:
    configJson: '{}'
    bearerTokenExistingSecret: ""
    bearerTokenSecretKey: token
    bearerTokenMountPath: /var/run/iip-policy-token
    caBundleExistingSecret: ""
    caBundleSecretKey: ca.crt
    caBundleMountPath: /var/run/iip-policy-ca

credentialBroker:
  mode: static
  externalHttp:
    configJson: '{}'
    audience: iip-credential-broker
    tokenExpirationSeconds: 600
    identityMountPath: /var/run/iip-credential-broker-identity
    caBundleExistingSecret: ""
    caBundleSecretKey: ca.crt
    caBundleMountPath: /var/run/iip-credential-broker-ca

telemetry:
  metricsEnabled: false
  tracesEnabled: false
  otlpEndpoint: ""
  protocol: http/protobuf
  attributeMode: source
  investigationAttributeMode: none
  serviceName: infra-intelligence-api
  workerServiceName: infra-intelligence-worker
  exportIntervalMillis: 60000
  exportTimeoutMillis: 10000
  traceScheduleDelayMillis: 5000
  traceExportTimeoutMillis: 10000
  traceMaxQueueSize: 2048
  traceMaxExportBatchSize: 512
  existingSecret: ""
  headersSecretKey: otlp-headers

telemetryEvidence:
  backend: no-data
  prometheus:
    integrationsJson: '{"integrations":[]}'
    credentialsExistingSecret: ""
    credentialsSecretKey: prometheus-credentials-json

logEvidence:
  backend: no-data
  loki:
    integrationsJson: '{"integrations":[]}'
    credentialsExistingSecret: ""
    credentialsSecretKey: loki-credentials-json

kubernetesEventEvidence:
  backend: no-data
  integrationsJson: '{"integrations":[]}'
  credentialsExistingSecret: ""
  credentialsSecretKey: kubernetes-events-credentials-json
  caBundleExistingSecret: ""
  caBundleSecretKey: ca.crt
  caBundleMountPath: /var/run/iip-kubernetes-events

kubernetesActions:
  executor: dry-run
  integrationsJson: '{"integrations":[]}'
  credentialsExistingSecret: ""
  credentialsSecretKey: kubernetes-actions-credentials-json
  caBundleExistingSecret: ""
  caBundleSecretKey: ca.crt
  caBundleMountPath: /var/run/iip-kubernetes-actions

contextEvidence:
  backend: no-data
  integrationsExistingSecret: ""
  integrationsSecretKey: context-integrations-json
  documentsExistingConfigMap: ""
  documentsMountPath: /var/run/iip-context

otlpReceiver:
  enabled: false
  channelsExistingSecret: ""
  channelsSecretKey: otlp-receiver-channels-json

otlpLogsReceiver:
  enabled: false
  channelsExistingSecret: ""
  channelsSecretKey: otlp-logs-receiver-channels-json

otlpIngest:
  replicaCount: 1
  httpHost: 0.0.0.0
  httpPort: 4318
  service:
    type: ClusterIP
    port: 4318
  maxRequestsPerSecond: 50
  requestBurst: 100
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 3
    databaseTimeoutSeconds: 2

networkPolicy:
  enabled: false
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: iip-system
  otlpReceiverIngress:
    enabled: false
    namespaceSelector:
      kubernetes.io/metadata.name: observability
    podSelector:
      app.kubernetes.io/name: opentelemetry-collector
  databaseEgress:
    enabled: false
    cidr: ""
    port: 5432
    namespaceSelector:
      kubernetes.io/metadata.name: iip-system
    podSelector:
      app.kubernetes.io/name: postgresql
  otlpEgress:
    enabled: false
    port: 4318
    namespaceSelector:
      kubernetes.io/metadata.name: observability
    podSelector:
      app.kubernetes.io/name: opentelemetry-collector
  prometheusEgress:
    enabled: false
    port: 9090
    namespaceSelector:
      kubernetes.io/metadata.name: observability
    podSelector:
      app.kubernetes.io/name: prometheus
  lokiEgress:
    enabled: false
    port: 3100
    namespaceSelector:
      kubernetes.io/metadata.name: observability
    podSelector:
      app.kubernetes.io/name: loki
  kubernetesApiEgress:
    enabled: false
    cidr: 10.96.0.1/32
    port: 443
  credentialBrokerEgress:
    enabled: false
    cidr: 10.96.0.1/32
    port: 8443
  oidcEgress:
    enabled: false
    cidr: 10.96.0.1/32
    port: 443
  policyEgress:
    enabled: false
    cidr: 10.96.0.1/32
    port: 443
  eventPublisherEgress:
    enabled: false
    cidr: 10.96.0.1/32
    port: 443

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
