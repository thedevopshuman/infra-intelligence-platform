{{- $dependencies := list -}}
{{- if .Values.database.existingSecret -}}
{{- $dependencies = append $dependencies (dict "purpose" "database" "kind" "Secret" "name" .Values.database.existingSecret "keys" (list .Values.database.secretKey)) -}}
{{- end -}}
{{- if and (eq .Values.auth.mode "local-hashed") .Values.auth.existingSecret -}}
