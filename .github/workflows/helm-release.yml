name: protected core Helm chart release

on:
  push:
    tags:
      - "helm-v*"

permissions:
  contents: read

concurrency:
  group: helm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'thedevopshuman/infra-intelligence-platform'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      DOCKER_CONFIG: /tmp/iip-helm-release-docker-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONPATH: src:sdks/python/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/verify.txt
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.1.3
      - run: python -m pip install --requirement requirements/verify.txt
      - name: Validate workflow and shared chart checks
        run: |
          make verify-workflows
          make verify-charts
      - name: Refuse an existing chart release
        env:
          GH_TOKEN: ${{ github.token }}
          HELM_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$HELM_RELEASE_TAG" --repo thedevopshuman/infra-intelligence-platform >/dev/null 2>&1; then
            echo '::error::This chart release already exists; use a new chart version.'
            exit 2
          fi
      - name: Prepare the exact committed core chart
        id: chart
        env:
          HELM_RELEASE_TAG: ${{ github.ref_name }}
          HELM_RELEASE_REVISION: ${{ github.sha }}
          HELM_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python scripts/prepare_helm_release.py \
            --tag "$HELM_RELEASE_TAG" \
            --revision "$HELM_RELEASE_REVISION" \
            --github-repository "$HELM_RELEASE_REPOSITORY" \
            --output "dist/$HELM_RELEASE_TAG"
          chart_version=${HELM_RELEASE_TAG#helm-v}
          printf 'archive=dist/%s/infra-intelligence-%s.tgz\n' "$HELM_RELEASE_TAG" "$chart_version" >> "$GITHUB_OUTPUT"
          printf 'checksums=dist/%s/SHA256SUMS\n' "$HELM_RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Sign and verify chart-only assets
        env:
          HELM_RELEASE_TAG: ${{ github.ref_name }}
          HELM_RELEASE_ARCHIVE: ${{ steps.chart.outputs.archive }}
          HELM_RELEASE_CHECKSUMS: ${{ steps.chart.outputs.checksums }}
        run: |
          for asset in "$HELM_RELEASE_ARCHIVE" "$HELM_RELEASE_CHECKSUMS"; do
            scripts/cosign_container.sh sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
            scripts/cosign_container.sh verify-blob --bundle "$asset.sigstore.json" \
              --certificate-identity "https://github.com/thedevopshuman/infra-intelligence-platform/.github/workflows/helm-release.yml@refs/tags/$HELM_RELEASE_TAG" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$asset"
          done
      - name: Publish separate core chart download
        env:
          GH_TOKEN: ${{ github.token }}
          HELM_RELEASE_TAG: ${{ github.ref_name }}
          HELM_RELEASE_ARCHIVE: ${{ steps.chart.outputs.archive }}
          HELM_RELEASE_CHECKSUMS: ${{ steps.chart.outputs.checksums }}
        run: |
          gh release create "$HELM_RELEASE_TAG" \
            "$HELM_RELEASE_ARCHIVE" "$HELM_RELEASE_ARCHIVE.sigstore.json" \
            "$HELM_RELEASE_CHECKSUMS" "$HELM_RELEASE_CHECKSUMS.sigstore.json" \
            --repo thedevopshuman/infra-intelligence-platform \
            --verify-tag --latest=false --title "IIP core Helm chart $HELM_RELEASE_TAG" \
            --notes 'Core chart only, with committed LICENSE/NOTICE and signed checksums. Requires the independently qualified application image and customer-owned dependencies. Not an application release, bundled stack, OCI chart repository, or cluster-installation qualification.'
