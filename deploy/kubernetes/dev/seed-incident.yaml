apiVersion: v1
kind: Namespace
metadata:
  name: iip-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-settings
  namespace: iip-demo
data:
  LOG_LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: iip-demo
  labels:
    app: api
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        team: platform
    spec:
      containers:
        - name: api
          image: registry.invalid/iip/missing:0.0.0
          volumeMounts:
            - name: settings
              mountPath: /etc/iip
      volumes:
        - name: settings
          configMap:
            name: api-settings
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: iip-demo
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: iip-demo
spec:
  rules:
    - host: api.iip-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
