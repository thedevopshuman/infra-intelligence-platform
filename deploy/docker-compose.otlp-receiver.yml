services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: iip
      POSTGRES_USER: iip
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iip -d iip"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:15434:5432"

  api:
    image: iip-otlp-receiver-test:0.81.0
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      IIP_DATABASE_URL: postgresql://iip@postgres:5432/iip
      IIP_DATABASE_AUTO_MIGRATE: "true"
      IIP_READINESS_DATABASE_TIMEOUT_SECONDS: "2"
      IIP_AUTH_IDENTITIES_JSON: ${IIP_AUTH_IDENTITIES_JSON:?set IIP_AUTH_IDENTITIES_JSON}
      IIP_OTLP_RECEIVER_MODE: disabled
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 2s
      timeout: 4s
      retries: 20
    ports:
      - "127.0.0.1:18080:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  receiver:
    image: iip-otlp-receiver-test:0.81.0
    pull_policy: never
    command: ["python", "-m", "iip.surfaces.otlp_receiver"]
    environment:
      IIP_DATABASE_URL: postgresql://iip@postgres:5432/iip
      IIP_DATABASE_AUTO_MIGRATE: "false"
      IIP_READINESS_DATABASE_TIMEOUT_SECONDS: "2"
      IIP_OTLP_HTTP_PORT: "4318"
      IIP_OTLP_TLS_MODE: mutual-spiffe
      IIP_OTLP_TLS_CERTIFICATE_PATH: /tls/server.crt
      IIP_OTLP_TLS_PRIVATE_KEY_PATH: /tls/server.key
      IIP_OTLP_TLS_CLIENT_CA_PATH: /tls/client-ca.crt
      IIP_OTLP_TLS_CLIENT_CRL_PATH: /tls/ca.crl
      IIP_OTLP_MTLS_IDENTITIES_JSON: ${IIP_OTLP_MTLS_IDENTITIES_JSON:?set IIP_OTLP_MTLS_IDENTITIES_JSON}
      IIP_OTLP_MAX_REQUESTS_PER_SECOND: "50"
      IIP_OTLP_REQUEST_BURST: "100"
      IIP_OTLP_RECEIVER_ENABLED: "true"
      IIP_OTLP_RECEIVER_CHANNELS_JSON: ${IIP_OTLP_RECEIVER_CHANNELS_JSON:?set IIP_OTLP_RECEIVER_CHANNELS_JSON}
      IIP_OTLP_LOGS_RECEIVER_ENABLED: "true"
      IIP_OTLP_LOGS_RECEIVER_CHANNELS_JSON: ${IIP_OTLP_LOGS_RECEIVER_CHANNELS_JSON:?set IIP_OTLP_LOGS_RECEIVER_CHANNELS_JSON}
      IIP_AI_USAGE_RECEIVER_ENABLED: "true"
      IIP_AI_USAGE_RECEIVER_CHANNELS_JSON: ${IIP_AI_USAGE_RECEIVER_CHANNELS_JSON:?set IIP_AI_USAGE_RECEIVER_CHANNELS_JSON}
      IIP_OTEL_METRICS_ENABLED: "true"
      IIP_OTEL_TRACES_ENABLED: "false"
      IIP_OTEL_INGESTION_ATTRIBUTE_MODE: none
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: "1000"
      OTEL_METRIC_EXPORT_TIMEOUT: "1000"
      OTEL_SERVICE_NAME: infra-intelligence-otlp-receiver-test
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ${IIP_OTLP_MTLS_FIXTURE_DIR:?set IIP_OTLP_MTLS_FIXTURE_DIR}:/tls:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:4318/readyz',context=ssl.create_default_context(cafile='/tls/ca.crt'),timeout=3)"]
      interval: 2s
      timeout: 4s
      retries: 20
    ports:
      - "127.0.0.1:18081:4318"
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  workflow-worker:
    image: iip-otlp-receiver-test:0.81.0
    pull_policy: never
    command: ["python", "-m", "iip.surfaces.worker"]
    environment:
      IIP_DATABASE_URL: postgresql://iip@postgres:5432/iip
      IIP_DATABASE_AUTO_MIGRATE: "false"
      IIP_WORKER_ID: otlp-cost-worker
      IIP_WORKER_TENANTS: local
      IIP_AI_COST_ENGINE_ENABLED: "true"
      IIP_AI_PRICE_CATALOGS_JSON: ${IIP_AI_PRICE_CATALOGS_JSON:?set IIP_AI_PRICE_CATALOGS_JSON}
      IIP_AI_PRICE_CATALOG_ALLOW_TEST_FIXTURES: "true"
      IIP_AI_COST_BATCH_SIZE: "100"
      IIP_AI_COST_INTERVAL_SECONDS: "1"
      IIP_EVENT_PUBLISHER_MODE: disabled
    depends_on:
      api:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: otel/opentelemetry-collector:0.158.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector-test.yaml:/etc/otelcol/config.yaml:ro
