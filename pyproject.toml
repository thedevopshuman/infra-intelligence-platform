[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-intelligence-kernel"
version = "0.18.0"
description = "Reference kernel for the Infrastructure Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography==49.0.0",
  "googleapis-common-protos==1.75.1",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-proto==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "psycopg[binary]==3.3.4",
  "PyJWT==2.13.0",
]

[project.scripts]
iip-api = "iip.surfaces.http:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"iip.adapters.postgres" = ["migrations/*.sql"]
"iip.surfaces" = ["static/*"]
