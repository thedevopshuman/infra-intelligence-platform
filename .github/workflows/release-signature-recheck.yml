name: release signature recheck

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose workflow signed the images
        required: true
        type: string
      control_plane_digest:
        description: Exact published control-plane sha256 digest
        required: true
        type: string
      bridge_digest:
        description: Exact published bridge sha256 digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  signatures:
    if: github.repository == 'thedevopshuman/infra-intelligence-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOCKER_CONFIG: /tmp/iip-signature-recheck-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/verify.txt
      - name: Install verifier dependencies
        run: python -m pip install --requirement requirements/verify.txt
      - name: Recheck only the two existing image signatures
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CONTROL_DIGEST: ${{ inputs.control_plane_digest }}
          BRIDGE_DIGEST: ${{ inputs.bridge_digest }}
        run: |
          python scripts/recheck_release_signatures.py \
            --tag "$RELEASE_TAG" \
            --control-plane-digest "$CONTROL_DIGEST" \
            --bridge-digest "$BRIDGE_DIGEST" \
            --cosign scripts/cosign_container.sh
