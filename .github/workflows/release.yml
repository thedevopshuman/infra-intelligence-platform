name: protected release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'thedevopshuman/infra-intelligence-platform'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOCKER_CONFIG: /tmp/iip-release-docker-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/verify.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.1.3
      - name: Validate workflow definitions
        run: make verify-workflows
      - name: Validate exact protected tag context
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python -m pip install --requirement requirements/verify.txt
          python scripts/release_publication.py validate-github-context \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_REVISION" \
            --main-revision "$(git rev-parse refs/remotes/origin/main)" \
            --github-repository "$RELEASE_REPOSITORY"
      - name: Derive exact release destinations
        id: release
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          chart_version=$(awk '$1 == "version:" {print $2; exit}' deploy/helm/infra-intelligence/Chart.yaml)
          short_revision=$(printf '%s' "$RELEASE_REVISION" | cut -c1-12)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'chart_version=%s\n' "$chart_version" >> "$GITHUB_OUTPUT"
          printf 'bundle=dist/iip-%s-%s\n' "$version" "$short_revision" >> "$GITHUB_OUTPUT"
          printf 'control_repository=docker.io/thedevopshuman/iip\n' >> "$GITHUB_OUTPUT"
          printf 'bridge_repository=docker.io/thedevopshuman/iip-bridge\n' >> "$GITHUB_OUTPUT"
      - name: Authenticate the publication boundary
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          if [ "$DOCKERHUB_USERNAME" != "thedevopshuman" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Configure the approved Docker Hub username and publishing token in the release environment.'
            exit 1
          fi
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io \
            --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 # qemu-v10.2.3-68
          platforms: arm64
      - name: Set up release OCI builder
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.2
          driver: docker-container
          driver-opts: image=docker.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea # v0.33.1
          use: true
          cleanup: true
      - name: Verify release builder platforms
        env:
          BUILDER_PLATFORMS: ${{ steps.buildx.outputs.platforms }}
        run: |
          docker buildx inspect --bootstrap
          python -c 'import os, sys; available = {item.strip() for item in os.environ["BUILDER_PLATFORMS"].split(",")}; sys.exit(0 if {"linux/amd64", "linux/arm64"} <= available else "Release builder lacks required AMD64/ARM64 platforms")'
      - name: Verify and build the clean candidate
        env:
          IIP_RELEASE_PLATFORMS: linux/amd64,linux/arm64
        run: |
          make verify
          make release-bundle
      - name: Publish exact verified OCI indexes
        env:
          RELEASE_BUNDLE: ${{ steps.release.outputs.bundle }}
          RELEASE_TAG: ${{ github.ref_name }}
          CONTROL_REPOSITORY: ${{ steps.release.outputs.control_repository }}
          BRIDGE_REPOSITORY: ${{ steps.release.outputs.bridge_repository }}
        run: |
          python scripts/release_publication.py publish "$RELEASE_BUNDLE" \
            --control-plane-repository "$CONTROL_REPOSITORY" \
            --bridge-repository "$BRIDGE_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --report dist/release-publication-report.json
      - name: Sign exact published indexes
        run: |
          control_reference=$(python scripts/release_publication.py reference \
            dist/release-publication-report.json --role control-plane-image)
          bridge_reference=$(python scripts/release_publication.py reference \
            dist/release-publication-report.json --role plugin-mediation-bridge-image)
          scripts/cosign_container.sh sign --yes "$control_reference"
          scripts/cosign_container.sh sign --yes "$bridge_reference"
      - name: Qualify release signatures and vulnerabilities
        env:
          IIP_RELEASE_BUNDLE: ${{ steps.release.outputs.bundle }}
          IIP_RELEASE_SIGNATURE_POLICY: dist/release-signature-policy.json
          IIP_RELEASE_SIGNATURE_REPORT: dist/release-signature-verification-report.json
          IIP_RELEASE_VULNERABILITY_REPORT: dist/release-vulnerability-qualification-report.json
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/release_publication.py github-signature-policy \
            dist/release-publication-report.json \
            --github-repository "$RELEASE_REPOSITORY" \
            --generation "$GITHUB_RUN_NUMBER" \
            --output "$IIP_RELEASE_SIGNATURE_POLICY"
          make qualify-release-signatures COSIGN=scripts/cosign_container.sh
          make qualify-release-vulnerabilities
      - name: Prepare signed customer release assets
        id: assets
        env:
          RELEASE_BUNDLE: ${{ steps.release.outputs.bundle }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          short_revision=$(printf '%s' "$RELEASE_REVISION" | cut -c1-12)
          archive="dist/iip-$RELEASE_VERSION-$short_revision.tar.gz"
          tar --create --gzip --file "$archive" \
            --directory dist "$(basename "$RELEASE_BUNDLE")"
          sha256sum "$archive" > "$archive.sha256"
          scripts/cosign_container.sh sign-blob --yes \
            --bundle "$archive.sigstore.json" "$archive"
          kit="$RELEASE_BUNDLE/infra-intelligence-community-$RELEASE_VERSION.tar.gz"
          scripts/cosign_container.sh sign-blob --yes \
            --bundle dist/community-kit.sigstore.json "$kit"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'kit=%s\n' "$kit" >> "$GITHUB_OUTPUT"
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE: ${{ steps.assets.outputs.archive }}
          RELEASE_KIT: ${{ steps.assets.outputs.kit }}
          RELEASE_BUNDLE: ${{ steps.release.outputs.bundle }}
          RELEASE_CHART_VERSION: ${{ steps.release.outputs.chart_version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' \
            'Verified IIP release candidate.' \
            'Install only by the immutable image digest in the attached manifest.' \
            > dist/release-notes.md
          gh release create "$RELEASE_TAG" \
            "$RELEASE_ARCHIVE#Verified release bundle" \
            "$RELEASE_ARCHIVE.sha256#Release bundle checksum" \
            "$RELEASE_ARCHIVE.sigstore.json#Release bundle Sigstore evidence" \
            "$RELEASE_KIT#Persistent Compose installation kit" \
            "dist/community-kit.sigstore.json#Compose kit Sigstore evidence" \
            "$RELEASE_BUNDLE/release-manifest.json#Release manifest" \
            "$RELEASE_BUNDLE/SHA256SUMS#Bundle checksums" \
            "$RELEASE_BUNDLE/infra-intelligence-$RELEASE_CHART_VERSION.tgz#Helm chart" \
            "dist/release-publication-report.json#Publication evidence" \
            "dist/release-signature-policy.json#Signature policy" \
            "dist/release-signature-verification-report.json#Signature evidence" \
            "dist/release-vulnerability-qualification-report.json#Vulnerability evidence" \
            --verify-tag --title "IIP $RELEASE_TAG" \
            --notes-file dist/release-notes.md
      - name: Clear publication credentials
        if: always()
        run: docker logout docker.io
