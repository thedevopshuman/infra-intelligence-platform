services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iip
      POSTGRES_USER: iip
      POSTGRES_PASSWORD: ${IIP_POSTGRES_PASSWORD:?set IIP_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iip -d iip"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      IIP_DATABASE_URL: postgresql://iip@postgres:5432/iip
      IIP_DATABASE_AUTO_MIGRATE: "true"
      IIP_AUTH_IDENTITIES_JSON: ${IIP_AUTH_IDENTITIES_JSON:?set IIP_AUTH_IDENTITIES_JSON}
      IIP_OTEL_METRICS_ENABLED: ${IIP_OTEL_METRICS_ENABLED:-false}
      IIP_OTLP_RECEIVER_ENABLED: ${IIP_OTLP_RECEIVER_ENABLED:-false}
      IIP_OTLP_RECEIVER_CHANNELS_JSON: ${IIP_OTLP_RECEIVER_CHANNELS_JSON:-}
      IIP_OTLP_LOGS_RECEIVER_ENABLED: ${IIP_OTLP_LOGS_RECEIVER_ENABLED:-false}
      IIP_OTLP_LOGS_RECEIVER_CHANNELS_JSON: ${IIP_OTLP_LOGS_RECEIVER_CHANNELS_JSON:-}
      IIP_TELEMETRY_METRICS_BACKEND: ${IIP_TELEMETRY_METRICS_BACKEND:-no-data}
      IIP_TELEMETRY_LOGS_BACKEND: ${IIP_TELEMETRY_LOGS_BACKEND:-no-data}
      IIP_PROMETHEUS_INTEGRATIONS_JSON: ${IIP_PROMETHEUS_INTEGRATIONS_JSON:-}
      IIP_PROMETHEUS_CREDENTIALS_JSON: ${IIP_PROMETHEUS_CREDENTIALS_JSON:-}
      IIP_LOKI_INTEGRATIONS_JSON: ${IIP_LOKI_INTEGRATIONS_JSON:-}
      IIP_LOKI_CREDENTIALS_JSON: ${IIP_LOKI_CREDENTIALS_JSON:-}
      IIP_CONTEXT_BACKEND: ${IIP_CONTEXT_BACKEND:-no-data}
      IIP_CONTEXT_INTEGRATIONS_JSON: ${IIP_CONTEXT_INTEGRATIONS_JSON:-}
      IIP_OTEL_INGESTION_ATTRIBUTE_MODE: ${IIP_OTEL_INGESTION_ATTRIBUTE_MODE:-source}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-60000}
      OTEL_METRIC_EXPORT_TIMEOUT: ${OTEL_METRIC_EXPORT_TIMEOUT:-10000}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-infra-intelligence-api}
      PGPASSWORD: ${IIP_POSTGRES_PASSWORD:?set IIP_POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - ./context:/var/run/iip-context:ro
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: otel/opentelemetry-collector:0.158.0
    profiles: ["telemetry"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector-test.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:14318:4318"

  prometheus:
    image: prom/prometheus:v3.13.1
    profiles: ["telemetry-query"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus-test.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:19090:9090"
    read_only: true
    tmpfs:
      - /prometheus:uid=65534,gid=65534,mode=0750

volumes:
  postgres-data:
