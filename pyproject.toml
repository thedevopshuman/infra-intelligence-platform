[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-intelligence-kernel"
version = "0.84.0"
description = "Reference kernel for the Infrastructure Intelligence Platform"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.1",
  "googleapis-common-protos==1.75.1",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-proto==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "psycopg==3.3.4",
  "PyJWT==2.13.0",
  "tzdata==2026.3",
]

[project.scripts]
iip-api = "iip.surfaces.http:main"
iip-worker = "iip.surfaces.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"iip.adapters.postgres" = ["migrations/*.sql"]
"iip.surfaces" = ["static/*"]
