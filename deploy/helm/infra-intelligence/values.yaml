replicaCount: 1

image:
  repository: ghcr.io/replace-me/infra-intelligence-platform
  pullPolicy: IfNotPresent
  tag: "0.2.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: http

config:
  httpHost: 0.0.0.0
  httpPort: 8080

database:
  existingSecret: ""
  secretKey: database-url
  autoMigrate: false

auth:
  existingSecret: ""
  secretKey: identities-json

telemetry:
  metricsEnabled: false
  otlpEndpoint: ""
  protocol: http/protobuf
  attributeMode: source
  serviceName: infra-intelligence-api
  exportIntervalMillis: 60000
  exportTimeoutMillis: 10000
  existingSecret: ""
  headersSecretKey: otlp-headers

telemetryEvidence:
  backend: no-data
  prometheus:
    integrationsJson: '{"integrations":[]}'
    credentialsExistingSecret: ""
    credentialsSecretKey: prometheus-credentials-json

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5

networkPolicy:
  enabled: false
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: iip-system
  otlpEgress:
    enabled: false
    port: 4318
    namespaceSelector:
      kubernetes.io/metadata.name: observability
    podSelector:
      app.kubernetes.io/name: opentelemetry-collector
  prometheusEgress:
    enabled: false
    port: 9090
    namespaceSelector:
      kubernetes.io/metadata.name: observability
    podSelector:
      app.kubernetes.io/name: prometheus

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
