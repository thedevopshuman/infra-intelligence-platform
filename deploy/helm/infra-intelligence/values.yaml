replicaCount: 1

apiTermination:
  gracePeriodSeconds: 60
  endpointDrainSeconds: 5

image:
  repository: ghcr.io/replace-me/infra-intelligence-platform
  pullPolicy: IfNotPresent
  tag: "0.79.0"
  digest: ""

worker:
  enabled: false
  replicaCount: 1
  terminationGracePeriodSeconds: 120
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  tenants: []
  leaseSeconds: 30
  heartbeatSeconds: 10
  retrySeconds: 5
  maxAttempts: 8
  investigationConcurrency: 4
  maxTenantInvestigationConcurrency: 1
  actionReconciliationBatchSize: 100
  ingestionMonitorTargets: []
  ingestionMonitorIntervalSeconds: 60
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

aiAttribution:
  enabled: false
  policiesExistingSecret: ""
  policiesSecretKey: ai-attribution-policies-json
  allowTestFixtures: false
  batchSize: 100
  intervalSeconds: 10

aiCostEngine:
  enabled: false
  catalogsExistingSecret: ""
  catalogsSecretKey: ai-price-catalogs-json
  allowTestFixtures: false
  batchSize: 100
  intervalSeconds: 10

aiSavingsEngine:
  enabled: false
  profilesExistingSecret: ""
  profilesSecretKey: ai-savings-profiles-json
  allowTestFixtures: false
  intervalSeconds: 60

aiAllocationReporting:
  enabled: false
  sourceRecordLimit: 10000
  windowSeconds: 86400
  intervalSeconds: 60

eventPublisher:
  mode: disabled
  batchSize: 100
  leaseSeconds: 30
  retryBaseSeconds: 5
  retryMaxSeconds: 300
  maxAttempts: 8
  httpsWebhook:
    endpoint: ""
    timeoutSeconds: 5
    maxResponseBytes: 4096
    tokenExistingSecret: ""
    tokenSecretKey: token
    tokenMountPath: /var/run/iip-event-publisher-token
    caBundleExistingSecret: ""
    caBundleSecretKey: ca.crt
    caBundleMountPath: /var/run/iip-event-publisher-ca

eventDeliverySlo:
  windowSeconds: 3600
  maximumDeliveryLatencySeconds: 60
  minimumAttainmentBasisPoints: 9900
  minimumEligibleEvents: 20

investigationCompletionSlo:
  windowSeconds: 3600
  maximumCompletionSeconds: 300
  minimumAttainmentBasisPoints: 9900
  minimumEligibleJobs: 20

investigationQueue:
  maxOutstandingJobsPerTenant: 1000

evidenceRetention:
  enabled: false
  intervalSeconds: 3600
  ephemeralSeconds: 86400
  standardSeconds: 2592000
  extendedSeconds: 31536000
  batchSize: 100

queryAvailabilitySlo:
  windowSeconds: 3600
  minimumAvailabilityBasisPoints: 9990
  minimumEligibleRequests: 100

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: http

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: /
  pathType: Prefix
  tls:
    existingSecret: ""
  tlsRedirectAnnotation: ""
  tlsRedirectValue: "true"

config:
  httpHost: 0.0.0.0
  httpPort: 8080

database:
  existingSecret: ""
  secretKey: database-url
  migrations:
    enabled: false
    backoffLimit: 2
    activeDeadlineSeconds: 300
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

backup:
  enabled: false
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  suspend: false
  startingDeadlineSeconds: 900
  activeDeadlineSeconds: 3600
  backoffLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  prefix: iip
  destination:
    existingClaim: ""
    mountPath: /var/lib/iip-backups
  image:
    repository: postgres
    digest: sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi

auth:
  mode: local-hashed
  existingSecret: iip-auth
  secretKey: identities-json
  oidc:
    configJson: '{}'
    caBundleExistingSecret: ""
    caBundleSecretKey: ca.crt
    caBundleMountPath: /var/run/iip-oidc-ca

policy:
  mode: local
  externalHttp:
    configJson: '{}'
    bearerTokenExistingSecret: ""
    bearerTokenSecretKey: token
    bearerTokenMountPath: /var/run/iip-policy-token
    caBundleExistingSecret: ""
    caBundleSecretKey: ca.crt
    caBundleMountPath: /var/run/iip-policy-ca

credentialBroker:
  mode: static
  externalHttp:
    configJson: '{}'
    audience: iip-credential-broker
    tokenExpirationSeconds: 600
    identityMountPath: /var/run/iip-credential-broker-identity
    caBundleExistingSecret: ""
    caBundleSecretKey: ca.crt
    caBundleMountPath: /var/run/iip-credential-broker-ca

telemetry:
  metricsEnabled: false
  tracesEnabled: false
  otlpEndpoint: ""
  protocol: http/protobuf
  attributeMode: source
  aiEconomicsAttributeMode: tenant-scope
  investigationAttributeMode: none
  serviceName: infra-intelligence-api
  workerServiceName: infra-intelligence-worker
  receiverServiceName: infra-intelligence-otlp-receiver
  exportIntervalMillis: 60000
  exportTimeoutMillis: 10000
  traceScheduleDelayMillis: 5000
  traceExportTimeoutMillis: 10000
  traceMaxQueueSize: 2048
  traceMaxExportBatchSize: 512
  healthReportIntervalSeconds: 30
  healthStaleAfterSeconds: 120
  healthRetentionSeconds: 600
  exportSloWindowSeconds: 3600
  exportSloMinimumAttainmentBasisPoints: 9900
  exportSloMinimumEligibleAttempts: 20
  exportSloRetentionSeconds: 604800
  exportBurnRateShortWindowSeconds: 3600
  exportBurnRateLongWindowSeconds: 21600
  exportBurnRateMinimumAttainmentBasisPoints: 9900
  exportBurnRateMinimumEligibleAttempts: 20
  exportBurnRateCriticalHundredths: 600
  existingSecret: ""
  headersSecretKey: otlp-headers

# Collector-observed sending-queue depth and send-loss objective (ADR 0087).
# Distinct from telemetry.exportBurnRate*, which measures IIP's own
# outbound exporter attempts rather than the customer Collector's internal
# queue for its pipeline to IIP. bindingJson is non-secret (an integration
# id and an exporter component name only, never a credential or endpoint)
# and left empty by default, which disables the report.
collectorQueueLoss:
  bindingJson: ""
  windowSeconds: 3600
  maxLossBasisPoints: 100
  maxQueueUtilizationBasisPoints: 8000
  minimumEligibleAttempts: 20

telemetryEvidence:
  backend: no-data
  prometheus:
    integrationsJson: '{"integrations":[]}'
    credentialsExistingSecret: ""
    credentialsSecretKey: prometheus-credentials-json

logEvidence:
  backend: no-data
  loki:
    integrationsJson: '{"integrations":[]}'
    credentialsExistingSecret: ""
    credentialsSecretKey: loki-credentials-json
  opensearch:
    integrationsJson: '{"integrations":[]}'
    credentialsExistingSecret: ""
    credentialsSecretKey: opensearch-credentials-json

kubernetesEventEvidence:
  backend: no-data
  integrationsJson: '{"integrations":[]}'
  credentialsExistingSecret: ""
  credentialsSecretKey: kubernetes-events-credentials-json
  caBundleExistingSecret: ""
  caBundleSecretKey: ca.crt
  caBundleMountPath: /var/run/iip-kubernetes-events

kubernetesActions:
  executor: dry-run
  integrationsJson: '{"integrations":[]}'
  credentialsExistingSecret: ""
  credentialsSecretKey: kubernetes-actions-credentials-json
  caBundleExistingSecret: ""
  caBundleSecretKey: ca.crt
  caBundleMountPath: /var/run/iip-kubernetes-actions

contextEvidence:
  backend: no-data
  integrationsExistingSecret: ""
  integrationsSecretKey: context-integrations-json
  credentialsExistingSecret: ""
  credentialsSecretKey: github-context-credentials-json
  caBundleExistingSecret: ""
  caBundleSecretKey: ca.crt
  caBundleMountPath: /var/run/iip-github-context-ca
  documentsExistingConfigMap: ""
  documentsMountPath: /var/run/iip-context

investigationSignalCatalog:
  existingSecret: ""
  secretKey: investigation-signal-catalog-json

otlpReceiver:
  enabled: false
  channelsExistingSecret: ""
  channelsSecretKey: otlp-receiver-channels-json

otlpLogsReceiver:
  enabled: false
  channelsExistingSecret: ""
  channelsSecretKey: otlp-logs-receiver-channels-json

aiUsageReceiver:
  enabled: false
  channelsExistingSecret: ""
  channelsSecretKey: ai-usage-receiver-channels-json

otlpIngest:
  replicaCount: 1
  terminationGracePeriodSeconds: 60
  endpointDrainSeconds: 5
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  httpHost: 0.0.0.0
  httpPort: 4318
  tls:
    mode: disabled
    serverExistingSecret: ""
    certificateSecretKey: tls.crt
    privateKeySecretKey: tls.key
    serverMountPath: /var/run/iip-otlp-tls
    clientCaExistingSecret: ""
    clientCaSecretKey: ca.crt
    clientCaMountPath: /var/run/iip-otlp-client-ca
    # Optional customer revocation list (ADRs 0088-0090). Empty disables CRL
    # checking. A configured single PEM CRL must be <=1 MiB and current; the
    # receiver fails readiness/intake at nextUpdate and requires a rollout
    # after rotation. Prefer a version-named immutable Secret so changing this
    # reference rolls the Deployment. The client CA bundle must include the
    # CRL-signing issuer. May reference the same Secret as clientCaExistingSecret.
    clientCrlExistingSecret: ""
    clientCrlSecretKey: ca.crl
    clientCrlMountPath: /var/run/iip-otlp-client-crl
    identitiesExistingSecret: ""
    identitiesSecretKey: otlp-client-identities-json
  service:
    type: ClusterIP
    port: 4318
  maxRequestsPerSecond: 50
  requestBurst: 100
  availabilitySlo:
    windowSeconds: 3600
    minimumAvailabilityBasisPoints: 9990
    minimumEligibleRequests: 100
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 3
    databaseTimeoutSeconds: 2

networkPolicy:
  enabled: false
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: iip-system
  ingressController:
    enabled: false
    namespaceSelector:
      kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      app.kubernetes.io/component: controller
  otlpReceiverIngress:
    enabled: false
    namespaceSelector:
      kubernetes.io/metadata.name: observability
    podSelector:
      app.kubernetes.io/name: opentelemetry-collector
  databaseEgress:
    enabled: false
    cidr: ""
    port: 5432
    namespaceSelector:
      kubernetes.io/metadata.name: iip-system
    podSelector:
      app.kubernetes.io/name: postgresql
  otlpEgress:
    enabled: false
    port: 4318
    namespaceSelector:
      kubernetes.io/metadata.name: observability
    podSelector:
      app.kubernetes.io/name: opentelemetry-collector
  prometheusEgress:
    enabled: false
    port: 9090
    namespaceSelector:
      kubernetes.io/metadata.name: observability
    podSelector:
      app.kubernetes.io/name: prometheus
  lokiEgress:
    enabled: false
    port: 3100
    namespaceSelector:
      kubernetes.io/metadata.name: observability
    podSelector:
      app.kubernetes.io/name: loki
  opensearchEgress:
    enabled: false
    port: 9200
    namespaceSelector:
      kubernetes.io/metadata.name: observability
    podSelector:
      app.kubernetes.io/name: opensearch
  contextEgress:
    enabled: false
    cidr: 10.96.0.1/32
    port: 443
  kubernetesApiEgress:
    enabled: false
    cidr: 10.96.0.1/32
    port: 443
  credentialBrokerEgress:
    enabled: false
    cidr: 10.96.0.1/32
    port: 8443
  oidcEgress:
    enabled: false
    cidr: 10.96.0.1/32
    port: 443
  policyEgress:
    enabled: false
    cidr: 10.96.0.1/32
    port: 443
  eventPublisherEgress:
    enabled: false
    cidr: 10.96.0.1/32
    port: 443

podDisruptionBudget:
  enabled: false
  minAvailable: 1

availability:
  topologySpread:
    enabled: false
    maxSkew: 1
    minDomains: 2
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

nodeSelector: {}
tolerations: []
affinity: {}
