apiVersion: v1
kind: Namespace
metadata:
  name: iip-action-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restart-probe
  namespace: iip-action-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restart-probe
  template:
    metadata:
      labels:
        app: restart-probe
    spec:
      containers:
        - name: probe
          image: registry.k8s.io/pause:3.9
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iip-action-executor
  namespace: iip-action-test
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iip-action-executor
  namespace: iip-action-test
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["restart-probe"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iip-action-executor
  namespace: iip-action-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iip-action-executor
subjects:
  - kind: ServiceAccount
    name: iip-action-executor
    namespace: iip-action-test
