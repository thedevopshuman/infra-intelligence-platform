extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  otlp/openai:
    protocols:
      http:
        endpoint: 0.0.0.0:4320

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    send_batch_size: 256
    timeout: 1s

exporters:
  otlp_http/iip:
    endpoint: http://ai-usage-receiver:4318
    headers:
      Authorization: Bearer ${env:IIP_AI_USAGE_CHANNEL_TOKEN}
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  otlp_http/iip_openai:
    endpoint: http://ai-usage-receiver:4318
    headers:
      Authorization: Bearer ${env:IIP_OPENAI_USAGE_CHANNEL_TOKEN}
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    translation_strategy: UnderscoreEscapingWithoutSuffixes
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces/bedrock:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/iip]
    traces/openai:
      receivers: [otlp/openai]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/iip_openai]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
