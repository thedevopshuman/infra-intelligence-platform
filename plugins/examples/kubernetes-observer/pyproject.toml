[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iip-kubernetes-observer"
version = "0.1.0"
description = "Read-only Kubernetes resource observer example for IIP"
requires-python = ">=3.11"
dependencies = ["infra-intelligence-sdk>=0.1.0"]

[project.scripts]
iip-kubernetes-observer = "kubernetes_observer.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
