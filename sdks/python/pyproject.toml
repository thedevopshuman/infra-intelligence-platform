[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-intelligence-sdk"
version = "0.84.0"
description = "Python client boundary for the Infrastructure Intelligence Platform"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
