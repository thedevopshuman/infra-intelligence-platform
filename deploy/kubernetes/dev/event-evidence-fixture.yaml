apiVersion: v1
kind: Namespace
metadata:
  name: iip-event-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iip-event-reader
  namespace: iip-event-test
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iip-event-reader
  namespace: iip-event-test
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iip-event-reader
  namespace: iip-event-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iip-event-reader
subjects:
  - kind: ServiceAccount
    name: iip-event-reader
    namespace: iip-event-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-probe
  namespace: iip-event-test
spec:
  replicas: 0
  selector:
    matchLabels:
      app: event-probe
  template:
    metadata:
      labels:
        app: event-probe
    spec:
      containers:
        - name: probe
          image: registry.k8s.io/pause:3.10
