name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      IIP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iip_test
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: iip_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/verify.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: azure/setup-helm@v4
      - run: python -m pip install --requirement requirements/verify.txt
      - run: make verify
