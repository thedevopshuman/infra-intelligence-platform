{{- if or .Values.otlpReceiver.enabled .Values.otlpLogsReceiver.enabled }}
{{- if not .Values.database.existingSecret }}
{{- fail "database.existingSecret is required when an OTLP receiver is enabled" }}
{{- end }}
{{- if and .Values.otlpReceiver.enabled (not .Values.otlpReceiver.channelsExistingSecret) }}
{{- fail "otlpReceiver.channelsExistingSecret is required when the metrics receiver is enabled" }}
{{- end }}
{{- if and .Values.otlpLogsReceiver.enabled (not .Values.otlpLogsReceiver.channelsExistingSecret) }}
{{- fail "otlpLogsReceiver.channelsExistingSecret is required when the logs receiver is enabled" }}
{{- end }}
{{- if and (ne .Values.otlpIngest.tls.mode "disabled") (not .Values.otlpIngest.tls.serverExistingSecret) }}
{{- fail "otlpIngest.tls.serverExistingSecret is required when receiver TLS is enabled" }}
{{- end }}
{{- if and (eq .Values.otlpIngest.tls.mode "mutual-spiffe") (not .Values.otlpIngest.tls.clientCaExistingSecret) }}
{{- fail "otlpIngest.tls.clientCaExistingSecret is required in mutual-spiffe mode" }}
{{- end }}
{{- if and (eq .Values.otlpIngest.tls.mode "mutual-spiffe") (not .Values.otlpIngest.tls.identitiesExistingSecret) }}
{{- fail "otlpIngest.tls.identitiesExistingSecret is required in mutual-spiffe mode" }}
{{- end }}
{{- if and .Values.networkPolicy.enabled (not .Values.networkPolicy.databaseEgress.enabled) }}
{{- fail "networkPolicy.databaseEgress.enabled is required for an isolated OTLP receiver" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infra-intelligence.fullname" . }}-otlp-receiver
  labels:
    {{- include "infra-intelligence.labels" . | nindent 4 }}
    app.kubernetes.io/component: otlp-receiver
spec:
  replicas: {{ .Values.otlpIngest.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "infra-intelligence.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: otlp-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "infra-intelligence.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: otlp-receiver
    spec:
      serviceAccountName: {{ include "infra-intelligence.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: otlp-receiver
          image: {{ include "infra-intelligence.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "iip.surfaces.otlp_receiver"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: IIP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.secretKey | quote }}
            - name: IIP_DATABASE_AUTO_MIGRATE
              value: "false"
            - name: IIP_READINESS_DATABASE_TIMEOUT_SECONDS
              value: {{ .Values.probes.readiness.databaseTimeoutSeconds | quote }}
            - name: IIP_OTEL_METRICS_ENABLED
              value: {{ .Values.telemetry.metricsEnabled | quote }}
            - name: IIP_OTEL_TRACES_ENABLED
              value: "false"
            - name: IIP_OTEL_INGESTION_ATTRIBUTE_MODE
              value: "none"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.telemetry.protocol | quote }}
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ .Values.telemetry.exportIntervalMillis | quote }}
            - name: OTEL_METRIC_EXPORT_TIMEOUT
              value: {{ .Values.telemetry.exportTimeoutMillis | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.telemetry.receiverServiceName | quote }}
            - name: IIP_TELEMETRY_HEALTH_INTERVAL_SECONDS
              value: {{ .Values.telemetry.healthReportIntervalSeconds | quote }}
            - name: IIP_TELEMETRY_HEALTH_STALE_AFTER_SECONDS
              value: {{ .Values.telemetry.healthStaleAfterSeconds | quote }}
            - name: IIP_TELEMETRY_HEALTH_RETENTION_SECONDS
              value: {{ .Values.telemetry.healthRetentionSeconds | quote }}
            - name: IIP_TELEMETRY_EXPORT_SLO_WINDOW_SECONDS
              value: {{ .Values.telemetry.exportSloWindowSeconds | quote }}
            - name: IIP_TELEMETRY_EXPORT_SLO_MINIMUM_ATTAINMENT_BASIS_POINTS
              value: {{ .Values.telemetry.exportSloMinimumAttainmentBasisPoints | quote }}
            - name: IIP_TELEMETRY_EXPORT_SLO_MINIMUM_ELIGIBLE_ATTEMPTS
              value: {{ .Values.telemetry.exportSloMinimumEligibleAttempts | quote }}
            - name: IIP_TELEMETRY_EXPORT_SLO_RETENTION_SECONDS
              value: {{ .Values.telemetry.exportSloRetentionSeconds | quote }}
            - name: IIP_TELEMETRY_EXPORT_BURN_RATE_SHORT_WINDOW_SECONDS
              value: {{ .Values.telemetry.exportBurnRateShortWindowSeconds | quote }}
            - name: IIP_TELEMETRY_EXPORT_BURN_RATE_LONG_WINDOW_SECONDS
              value: {{ .Values.telemetry.exportBurnRateLongWindowSeconds | quote }}
            - name: IIP_TELEMETRY_EXPORT_BURN_RATE_MINIMUM_ATTAINMENT_BASIS_POINTS
              value: {{ .Values.telemetry.exportBurnRateMinimumAttainmentBasisPoints | quote }}
            - name: IIP_TELEMETRY_EXPORT_BURN_RATE_MINIMUM_ELIGIBLE_ATTEMPTS
              value: {{ .Values.telemetry.exportBurnRateMinimumEligibleAttempts | quote }}
            - name: IIP_TELEMETRY_EXPORT_BURN_RATE_CRITICAL_HUNDREDTHS
              value: {{ .Values.telemetry.exportBurnRateCriticalHundredths | quote }}
            - name: IIP_OTLP_RECEIVER_SLO_WINDOW_SECONDS
              value: {{ .Values.otlpIngest.availabilitySlo.windowSeconds | quote }}
            - name: IIP_OTLP_RECEIVER_SLO_MINIMUM_BASIS_POINTS
              value: {{ .Values.otlpIngest.availabilitySlo.minimumAvailabilityBasisPoints | quote }}
            - name: IIP_OTLP_RECEIVER_SLO_MINIMUM_ELIGIBLE_REQUESTS
              value: {{ .Values.otlpIngest.availabilitySlo.minimumEligibleRequests | quote }}
            {{- if .Values.telemetry.existingSecret }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.telemetry.existingSecret | quote }}
                  key: {{ .Values.telemetry.headersSecretKey | quote }}
            {{- end }}
            - name: IIP_POLICY_MODE
              value: {{ .Values.policy.mode | quote }}
            - name: IIP_POLICY_CONFIG_JSON
              value: {{ .Values.policy.externalHttp.configJson | quote }}
            - name: IIP_OTLP_HTTP_HOST
              value: {{ .Values.otlpIngest.httpHost | quote }}
            - name: IIP_OTLP_HTTP_PORT
              value: {{ .Values.otlpIngest.httpPort | quote }}
            - name: IIP_OTLP_TLS_MODE
              value: {{ .Values.otlpIngest.tls.mode | quote }}
            {{- if ne .Values.otlpIngest.tls.mode "disabled" }}
            - name: IIP_OTLP_TLS_CERTIFICATE_PATH
              value: {{ printf "%s/tls.crt" .Values.otlpIngest.tls.serverMountPath | quote }}
            - name: IIP_OTLP_TLS_PRIVATE_KEY_PATH
              value: {{ printf "%s/tls.key" .Values.otlpIngest.tls.serverMountPath | quote }}
            {{- end }}
            {{- if eq .Values.otlpIngest.tls.mode "mutual-spiffe" }}
            - name: IIP_OTLP_TLS_CLIENT_CA_PATH
              value: {{ printf "%s/ca.crt" .Values.otlpIngest.tls.clientCaMountPath | quote }}
            {{- if .Values.otlpIngest.tls.clientCrlExistingSecret }}
            - name: IIP_OTLP_TLS_CLIENT_CRL_PATH
              value: {{ printf "%s/ca.crl" .Values.otlpIngest.tls.clientCrlMountPath | quote }}
            {{- end }}
            - name: IIP_OTLP_MTLS_IDENTITIES_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otlpIngest.tls.identitiesExistingSecret | quote }}
                  key: {{ .Values.otlpIngest.tls.identitiesSecretKey | quote }}
            {{- end }}
            - name: IIP_OTLP_MAX_REQUESTS_PER_SECOND
              value: {{ .Values.otlpIngest.maxRequestsPerSecond | quote }}
            - name: IIP_OTLP_REQUEST_BURST
              value: {{ .Values.otlpIngest.requestBurst | quote }}
            - name: IIP_OTLP_RECEIVER_ENABLED
              value: {{ .Values.otlpReceiver.enabled | quote }}
            - name: IIP_OTLP_LOGS_RECEIVER_ENABLED
              value: {{ .Values.otlpLogsReceiver.enabled | quote }}
            {{- if .Values.otlpReceiver.enabled }}
            - name: IIP_OTLP_RECEIVER_CHANNELS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otlpReceiver.channelsExistingSecret | quote }}
                  key: {{ .Values.otlpReceiver.channelsSecretKey | quote }}
            {{- end }}
            {{- if .Values.otlpLogsReceiver.enabled }}
            - name: IIP_OTLP_LOGS_RECEIVER_CHANNELS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otlpLogsReceiver.channelsExistingSecret | quote }}
                  key: {{ .Values.otlpLogsReceiver.channelsSecretKey | quote }}
            {{- end }}
          ports:
            - name: otlp-http
              containerPort: {{ .Values.otlpIngest.httpPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: otlp-http
              scheme: {{ if eq .Values.otlpIngest.tls.mode "disabled" }}HTTP{{ else }}HTTPS{{ end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: otlp-http
              scheme: {{ if eq .Values.otlpIngest.tls.mode "disabled" }}HTTP{{ else }}HTTPS{{ end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          resources:
            {{- toYaml .Values.otlpIngest.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if ne .Values.otlpIngest.tls.mode "disabled" }}
            - name: otlp-server-tls
              mountPath: {{ .Values.otlpIngest.tls.serverMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if eq .Values.otlpIngest.tls.mode "mutual-spiffe" }}
            - name: otlp-client-ca
              mountPath: {{ .Values.otlpIngest.tls.clientCaMountPath | quote }}
              readOnly: true
            {{- if .Values.otlpIngest.tls.clientCrlExistingSecret }}
            - name: otlp-client-crl
              mountPath: {{ .Values.otlpIngest.tls.clientCrlMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if eq .Values.policy.mode "external-http" }}
            {{- if .Values.policy.externalHttp.bearerTokenExistingSecret }}
            - name: policy-token
              mountPath: {{ .Values.policy.externalHttp.bearerTokenMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.policy.externalHttp.caBundleExistingSecret }}
            - name: policy-ca
              mountPath: {{ .Values.policy.externalHttp.caBundleMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if ne .Values.otlpIngest.tls.mode "disabled" }}
        - name: otlp-server-tls
          secret:
            secretName: {{ .Values.otlpIngest.tls.serverExistingSecret | quote }}
            items:
              - key: {{ .Values.otlpIngest.tls.certificateSecretKey | quote }}
                path: tls.crt
              - key: {{ .Values.otlpIngest.tls.privateKeySecretKey | quote }}
                path: tls.key
        {{- end }}
        {{- if eq .Values.otlpIngest.tls.mode "mutual-spiffe" }}
        - name: otlp-client-ca
          secret:
            secretName: {{ .Values.otlpIngest.tls.clientCaExistingSecret | quote }}
            items:
              - key: {{ .Values.otlpIngest.tls.clientCaSecretKey | quote }}
                path: ca.crt
        {{- if .Values.otlpIngest.tls.clientCrlExistingSecret }}
        - name: otlp-client-crl
          secret:
            secretName: {{ .Values.otlpIngest.tls.clientCrlExistingSecret | quote }}
            items:
              - key: {{ .Values.otlpIngest.tls.clientCrlSecretKey | quote }}
                path: ca.crl
        {{- end }}
        {{- end }}
        {{- if and (eq .Values.policy.mode "external-http") .Values.policy.externalHttp.bearerTokenExistingSecret }}
        - name: policy-token
          secret:
            secretName: {{ .Values.policy.externalHttp.bearerTokenExistingSecret | quote }}
            items:
              - key: {{ .Values.policy.externalHttp.bearerTokenSecretKey | quote }}
                path: token
        {{- end }}
        {{- if and (eq .Values.policy.mode "external-http") .Values.policy.externalHttp.caBundleExistingSecret }}
        - name: policy-ca
          secret:
            secretName: {{ .Values.policy.externalHttp.caBundleExistingSecret | quote }}
            items:
              - key: {{ .Values.policy.externalHttp.caBundleSecretKey | quote }}
                path: ca.crt
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
