apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "infra-intelligence.fullname" . }}
  labels:
    {{- include "infra-intelligence.labels" . | nindent 4 }}
data:
  IIP_DEPLOYMENT_HELM_CHART_VERSION: {{ .Chart.Version | quote }}
  IIP_DEPLOYMENT_IMAGE_DIGEST: {{ .Values.image.digest | quote }}
  IIP_HTTP_HOST: {{ .Values.config.httpHost | quote }}
  IIP_HTTP_PORT: {{ .Values.config.httpPort | quote }}
  IIP_AUTH_MODE: {{ .Values.auth.mode | quote }}
  IIP_AUTH_OIDC_CONFIG_JSON: {{ .Values.auth.oidc.configJson | quote }}
  IIP_POLICY_MODE: {{ .Values.policy.mode | quote }}
  IIP_POLICY_CONFIG_JSON: {{ .Values.policy.externalHttp.configJson | quote }}
  IIP_CREDENTIAL_BROKER_MODE: {{ .Values.credentialBroker.mode | quote }}
  IIP_CREDENTIAL_BROKER_CONFIG_JSON: {{ .Values.credentialBroker.externalHttp.configJson | quote }}
  IIP_DATABASE_AUTO_MIGRATE: "false"
  IIP_READINESS_DATABASE_TIMEOUT_SECONDS: {{ .Values.probes.readiness.databaseTimeoutSeconds | quote }}
  IIP_OTEL_METRICS_ENABLED: {{ .Values.telemetry.metricsEnabled | quote }}
  IIP_OTEL_TRACES_ENABLED: {{ .Values.telemetry.tracesEnabled | quote }}
  IIP_OTLP_RECEIVER_MODE: "disabled"
  IIP_OTEL_INGESTION_ATTRIBUTE_MODE: {{ .Values.telemetry.attributeMode | quote }}
  IIP_OTEL_INVESTIGATION_ATTRIBUTE_MODE: {{ .Values.telemetry.investigationAttributeMode | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.telemetry.otlpEndpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.telemetry.protocol | quote }}
  OTEL_METRIC_EXPORT_INTERVAL: {{ .Values.telemetry.exportIntervalMillis | quote }}
  OTEL_METRIC_EXPORT_TIMEOUT: {{ .Values.telemetry.exportTimeoutMillis | quote }}
  OTEL_BSP_SCHEDULE_DELAY: {{ .Values.telemetry.traceScheduleDelayMillis | quote }}
  OTEL_BSP_EXPORT_TIMEOUT: {{ .Values.telemetry.traceExportTimeoutMillis | quote }}
  OTEL_BSP_MAX_QUEUE_SIZE: {{ .Values.telemetry.traceMaxQueueSize | quote }}
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: {{ .Values.telemetry.traceMaxExportBatchSize | quote }}
  OTEL_SERVICE_NAME: {{ .Values.telemetry.serviceName | quote }}
  IIP_TELEMETRY_METRICS_BACKEND: {{ .Values.telemetryEvidence.backend | quote }}
  IIP_TELEMETRY_LOGS_BACKEND: {{ .Values.logEvidence.backend | quote }}
  IIP_PROMETHEUS_INTEGRATIONS_JSON: {{ .Values.telemetryEvidence.prometheus.integrationsJson | quote }}
  IIP_LOKI_INTEGRATIONS_JSON: {{ .Values.logEvidence.loki.integrationsJson | quote }}
  IIP_KUBERNETES_EVENTS_BACKEND: {{ .Values.kubernetesEventEvidence.backend | quote }}
  IIP_KUBERNETES_EVENTS_INTEGRATIONS_JSON: {{ .Values.kubernetesEventEvidence.integrationsJson | quote }}
  IIP_KUBERNETES_ACTION_EXECUTOR: {{ .Values.kubernetesActions.executor | quote }}
  IIP_KUBERNETES_ACTIONS_INTEGRATIONS_JSON: {{ .Values.kubernetesActions.integrationsJson | quote }}
  IIP_CONTEXT_BACKEND: {{ .Values.contextEvidence.backend | quote }}
