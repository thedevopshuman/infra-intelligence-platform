[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iip-kubernetes-observer"
version = "0.3.0"
description = "Read-only Kubernetes resource observer example for IIP"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = ["infra-intelligence-sdk>=0.4.0"]

[project.scripts]
iip-kubernetes-observer = "kubernetes_observer.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
