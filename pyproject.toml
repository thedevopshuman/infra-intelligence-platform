[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-intelligence-kernel"
version = "0.3.1"
description = "Reference kernel for the Infrastructure Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]==3.3.4"]

[project.scripts]
iip-api = "iip.surfaces.http:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"iip.adapters.postgres" = ["migrations/*.sql"]
