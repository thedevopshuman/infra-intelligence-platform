apiVersion: v1
kind: ServiceAccount
metadata:
  name: iip-action-executor
  namespace: default
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iip-action-executor
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    resourceNames: ["replace-me-workload"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iip-action-executor
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iip-action-executor
subjects:
  - kind: ServiceAccount
    name: iip-action-executor
    namespace: default
