# Apply after production-core.values.yaml to install the optional Prometheus
# Operator rule handoff. The customer Prometheus/Thanos selector must select the
# metadata labels below, and its Alertmanager owns routing and receivers.
operationalAlerts:
  enabled: true
  namespace: observability
  telemetryHeartbeatWindowSeconds: 300
  telemetryHeartbeatForSeconds: 300
  labels:
    prometheus: platform
    role: alert-rules
