[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iip-opentelemetry-aws-bedrock"
version = "0.1.0"
description = "Metadata-only AWS Bedrock usage enrichment for OpenTelemetry Python botocore instrumentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "botocore==1.43.73",
  "opentelemetry-instrumentation-botocore==0.65b0",
]

[project.entry-points.opentelemetry_pre_instrument]
iip_aws_bedrock_usage = "iip_otel_aws_bedrock:install"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
