{{- if .Values.database.migrations.enabled }}
{{- $databaseSecret := required "database.existingSecret is required when database.migrations.enabled=true" .Values.database.existingSecret }}
{{- if and .Values.networkPolicy.enabled (not .Values.networkPolicy.databaseEgress.enabled) }}{{ fail "networkPolicy.databaseEgress.enabled must be true for migrations when NetworkPolicy is enabled" }}{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "infra-intelligence.fullname" . }}-migrate
  labels:
    {{- include "infra-intelligence.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.database.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.database.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "infra-intelligence.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database-migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "infra-intelligence.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "iip.adapters.postgres"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: IIP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $databaseSecret | quote }}
                  key: {{ .Values.database.secretKey | quote }}
            - name: IIP_DATABASE_TRANSPORT_MODE
              value: {{ .Values.database.transportSecurity.mode | quote }}
            {{- if eq .Values.database.transportSecurity.mode "verify-full" }}
            - name: IIP_DATABASE_CA_PATH
              value: "/var/run/iip/database-ca/ca.crt"
            {{- end }}
          resources:
            {{- toYaml .Values.database.migrations.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.database.transportSecurity.mode "verify-full" }}
            - name: database-ca
              mountPath: /var/run/iip/database-ca/ca.crt
              subPath: ca.crt
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.database.transportSecurity.mode "verify-full" }}
        - name: database-ca
          secret:
            secretName: {{ .Values.database.transportSecurity.caExistingSecret | quote }}
            items:
              - key: {{ .Values.database.transportSecurity.caKey | quote }}
                path: ca.crt
        {{- end }}
{{- end }}
