services:
  oidc-issuer:
    image: python:3.12-slim@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a
    command: ["python", "/app/oidc_issuer_fixture.py"]
    user: "65532:65532"
    volumes:
      - ../tests/fixtures/oidc_issuer_fixture.py:/app/oidc_issuer_fixture.py:ro
      - ${IIP_OIDC_ISSUER_FIXTURE_DIR:?fixture directory is required}:/fixture
    ports:
      - "127.0.0.1:19443:8443"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import ssl,urllib.request;
          urllib.request.urlopen('https://127.0.0.1:8443/healthz',
          context=ssl._create_unverified_context(),timeout=2).read()
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
